<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KN Admin Portal</title>
<style>
:root{--blue:#2448b7;--navy:#172c53;--red:#e84343;--yellow:#f4a52b;--bg:#f6f8fb;--ink:#23334b;--muted:#8090a7;--line:#e9edf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;background:var(--blue);border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:13px;color:var(--blue);letter-spacing:.3px}.brand small{display:block;font-size:10px;color:var(--yellow);font-weight:bold}
.header-right{display:flex;align-items:center;gap:12px}.search{background:#f5f7fa;border-radius:24px;padding:10px 14px;width:290px;border:1px solid #f0f2f5}.search input{border:0;background:transparent;outline:0;width:90%}.avatar{background:var(--blue);color:white;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:bold}.user{text-align:right;font-size:11px;font-weight:700}.user small{display:block;color:var(--yellow);font-size:9px;letter-spacing:1px}
aside{position:fixed;top:76px;bottom:0;left:0;width:230px;background:white;border-right:1px solid var(--line);padding:18px 14px;overflow:auto;z-index:4}nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:white;color:#71829d;border:0;border-radius:25px;padding:13px 15px;margin:3px 0;font-size:11px;font-weight:800;letter-spacing:.4px;cursor:pointer}nav button:hover{background:#f4f6fb}nav button.active{background:var(--blue);color:white;box-shadow:0 5px 12px #2448b733}.ico{width:20px;text-align:center;font-size:15px}
main{margin:76px 0 0 230px;padding:30px;min-height:calc(100vh - 76px)}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:10px;color:var(--blue);letter-spacing:1px;font-weight:800;margin-bottom:8px}.pagehead h1{margin:0;font-size:22px}.pagehead p{margin:5px 0;color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px;margin-bottom:22px}.card,.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 3px 16px #172c5305}.card .label{color:var(--muted);font-size:12px}.card strong{display:block;font-size:25px;color:var(--blue);margin:12px 0}.card small{color:var(--muted)}.panel{margin-bottom:18px}.panel h3{margin:0 0 16px;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button.primary{background:var(--blue);color:white;border:0;padding:11px 16px;border-radius:11px;font-weight:800;cursor:pointer}button.secondary{background:#f1f4fa;color:var(--blue);border:0;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}button.danger{background:#fff0f0;color:#c33;border:0;padding:8px 11px;border-radius:9px;cursor:pointer}button.small{padding:7px 10px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f8f9fb;color:#71829d;font-size:10px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}
label{display:block;font-size:11px;font-weight:700;color:#71829d;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #dfe5ed;border-radius:9px;padding:10px;background:white;color:var(--ink);font:inherit}textarea{min-height:70px}form .actions{margin-top:15px;display:flex;gap:8px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hidden{display:none!important}.pill{display:inline-block;padding:5px 9px;border-radius:15px;background:#eef2ff;color:var(--blue);font-size:10px;font-weight:700}.pill.red{background:#fff0f0;color:#c33}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#12233a66;display:grid;place-items:center;z-index:20;padding:20px}.modalbox{background:white;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.toast{position:fixed;bottom:22px;right:22px;background:#172c53;color:white;padding:13px 18px;border-radius:12px;z-index:30;box-shadow:0 8px 30px #172c5340}
footer{margin:0 0 0 230px;padding:10px 30px;color:#93a1b6;font-size:10px;letter-spacing:.7px}
@media(max-width:900px){aside{width:auto;position:relative;top:76px;display:flex;overflow-x:auto;height:auto;bottom:auto;padding:8px}nav{display:flex}nav button{white-space:nowrap;width:auto}main{margin-left:0;padding:18px;margin-top:76px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}.search{display:none}footer{margin-left:0}}
@media(max-width:600px){.cards,.grid2,.grid3,.formgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body>
<header><div class="brand"><div class="logo">KN</div><div><b>KONSORSIUM NASIONAL</b><small>TRAVEL PARTNER WITH HEART</small></div></div><div class="header-right"><div class="search">⌕ <input id="globalSearch" placeholder="Cari data, booking, agent..."></div><span>⌂</span><span>♧</span><div class="user"><b>ADMIN KN</b><small>MANAGER</small></div><div class="avatar">K</div></div></header>
<aside><nav id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span> DASHBOARD</button>
<button data-page="agents"><span class="ico">▤</span> MASTER AGENT</button>
<button data-page="airlines"><span class="ico">✈</span> AIRLINES / FLIGHT PRICES</button>
<button data-page="destinations"><span class="ico">◎</span> DESTINASI WISATA</button>
<button data-page="packages"><span class="ico">▧</span> PAKET TOUR</button>
<button data-page="departures"><span class="ico">✈</span> KEBERANGKATAN</button>
<button data-page="quota"><span class="ico">▥</span> SUMMARY QUOTA</button>
<button data-page="bookings"><span class="ico">▤</span> BOOKING</button>
<button data-page="participants"><span class="ico">♙</span> DATA PESERTA</button>
<button data-page="rooms"><span class="ico">▣</span> ROOMING LIST</button>
<button data-page="payments"><span class="ico">Rp</span> PEMBAYARAN</button>
<button data-page="invoices"><span class="ico">▧</span> INVOICE</button>
<button data-page="reports"><span class="ico">▥</span> REPORT</button>
<button data-page="settings"><span class="ico">⚙</span> PENGATURAN / BACKUP</button>
</nav></aside><main id="main"></main><footer>© 2026 KONSORSIUM NASIONAL · INTEGRATED PORTAL</footer>
<div id="modal" class="hidden"></div><div id="toast" class="hidden toast"></div>
<script>
const KEY='knportal-full-v1';const empty={agents:[],airlines:[],destinations:[],packages:[],departures:[],bookings:[],participants:[],rooms:[],payments:[],settings:{company:'Konsorsium Nasional',prefix:'KN',invoicePrefix:'INV-KN',currency:'IDR'}};
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')||empty}catch{db=empty}for(const k in empty)if(!db[k])db[k]=empty[k];let page='dashboard';
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();toast('Data tersimpan')}
function toast(m){let t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function nav(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function heading(title,sub,button=''){return `<div class="pagehead"><div><div class="eyebrow">⌂ ADMIN PORTAL / ${title.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function stat(label,value,sub){return `<div class="card"><div class="label">${label}</div><strong>${value}</strong><small>${sub||''}</small></div>`}
function panel(title,content){return `<div class="panel"><h3>${title}</h3>${content}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">Belum ada data</td></tr>`}</tbody></table></div>`}
function btn(text,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}
function selectOpts(arr,idkey='id',labelkey='name'){return arr.map(x=>`<option value="${esc(x[idkey])}">${esc(x[labelkey])}</option>`).join('')}
function depName(id){return db.departures.find(x=>x.id===id)?.name||db.departures.find(x=>x.id===id)?.date||'-'}function agentName(id){return db.agents.find(x=>x.id===id)?.name||'-'}function pkgName(id){return db.packages.find(x=>x.id===id)?.name||'-'}
function total(b){return Number(b.price||0)*Number(b.pax||0)+Number(b.extra||0)-Number(b.discount||0)}function paid(b){return db.payments.filter(p=>p.bookingId===b.id).reduce((s,p)=>s+Number(p.amount||0),0)}function modal(title,body){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="secondary" onclick="closeModal()">✕</button></div>${body}</div></div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function field(label,name,type='text',value='',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function addForm(kind,fields,handler){modal('Tambah '+kind,`<form id="dynamicForm"><div class="formgrid">${fields}</div><div class="actions"><button class="primary">Simpan</button><button type="button" class="secondary" onclick="closeModal()">Batal</button></div></form>`);$('#dynamicForm').onsubmit=e=>{e.preventDefault();handler(Object.fromEntries(new FormData(e.target)));closeModal();save()}}
function del(kind,id){if(confirm('Hapus data ini?')){db[kind]=db[kind].filter(x=>x.id!==id);save()}}
function dashboard(){let pax=db.bookings.reduce((s,b)=>s+Number(b.pax||0),0),rev=db.bookings.reduce((s,b)=>s+total(b),0),payments=db.payments.reduce((s,p)=>s+Number(p.amount||0),0),outstanding=rev-payments;let upcoming=db.departures.filter(d=>d.date>=new Date().toISOString().slice(0,10));return heading('Ikhtisar Dashboard','Pantau performa bisnis Konsorsium Nasional secara ringkas.',btn('+ TAMBAH BOOKING','openBooking()','primary'))+`<div class="cards">${stat('TOTAL BOOKING',db.bookings.length,'Booking tercatat')}${stat('TOTAL PESERTA',pax,'Pax terdaftar')}${stat('TOTAL NILAI BOOKING','Rp '+money(rev),'Nilai booking')}${stat('OUTSTANDING','Rp '+money(outstanding),'Belum dibayar')}</div>`+panel('Keberangkatan mendatang',table(['Departure','Tanggal','Paket','Quota','Booking'],upcoming.slice(0,8).map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.date)}</td><td>${esc(pkgName(d.packageId))}</td><td>${esc(d.quota||'-')}</td><td>${db.bookings.filter(b=>b.departureId===d.id).length}</td></tr>`)))+panel('Booking terbaru',table(['Kode','Agent','Departure','Pax','Total','Status'],db.bookings.slice(-8).reverse().map(b=>`<tr><td>${esc(b.code)}</td><td>${esc(agentName(b.agentId))}</td><td>${esc(depName(b.departureId))}</td><td>${b.pax}</td><td>Rp ${money(total(b))}</td><td><span class="pill">${esc(b.status||'Booked')}</span></td></tr>`)))}
function listPage(title,sub,kind,cols,keys,formFields,addLabel='Tambah'){let rows=db[kind].map(x=>`<tr>${keys.map(k=>`<td>${esc(x[k]??'-')}</td>`).join('')}<td><button class="danger small" onclick="del('${kind}','${x.id}')">Hapus</button></td></tr>`);let fieldhtml=formFields;return heading(title,sub,btn('+ '+addLabel.toUpperCase(),'add'+kind+'()','primary'))+panel(title,table([...cols,'Aksi'],rows))}
function agents(){return listPage('Master Agent','Database partner travel agent','agents',['Nama Agent','PIC','Telepon','Email','Alamat'],['name','pic','phone','email','address'],null)}
function addagents(){addForm('Agent',[field('Nama Agent','name'),field('PIC','pic'),field('Telepon','phone'),field('Email','email','email'),field('Alamat','address'),field('Catatan','note')],x=>db.agents.push({...x,id:uid()}))}
function airlines(){return listPage('Airlines & Flight Prices','Master airline dan informasi harga flight','airlines',['Airline','Route','Harga','Catatan'],['name','route','price','note'])}
function addairlines(){addForm('Airline / Flight',[field('Airline','name'),field('Route','route'),field('Harga','price','number'),field('Catatan','note')],x=>db.airlines.push({...x,id:uid()}))}
function destinations(){return listPage('Destinasi Wisata','Master destinasi dan objek wisata','destinations',['Nama','Negara','Kota','Catatan'],['name','country','city','note'])}
function adddestinations(){addForm('Destinasi',[field('Nama Destinasi','name'),field('Negara','country'),field('Kota','city'),field('Catatan','note')],x=>db.destinations.push({...x,id:uid()}))}
function packages(){return listPage('Paket Tour','Master produk tour','packages',['Nama Paket','Durasi','Negara','Harga/Pax','Deskripsi'],['name','duration','countries','price','description'])}
function addpackages(){addForm('Paket Tour',[field('Nama Paket','name'),field('Durasi','duration'),field('Negara / Kota','countries'),field('Harga/Pax','price','number'),field('Deskripsi','description')],x=>db.packages.push({...x,id:uid()}))}
function departures(){return listPage('Keberangkatan','Jadwal departure, quota dan status','departures',['Nama Departure','Tanggal','Paket','Quota','Airline','Status'],['name','date','packageName','quota','airline','status'])}
function adddepartures(){addForm('Departure',[field('Nama Departure','name'),field('Tanggal','date','date'),`<div><label>Paket Tour</label><select name="packageId">${selectOpts(db.packages)}</select></div>`,field('Quota','quota','number'),field('Airline','airline'),field('Status','status')],x=>{x.id=uid();x.packageName=pkgName(x.packageId);db.departures.push(x)})}
function quota(){return heading('Summary Quota','Monitoring quota dan pemesanan per departure')+panel('Quota Departure',table(['Departure','Paket','Tanggal','Quota','Booked Pax','Sisa Quota'],db.departures.map(d=>{let booked=db.bookings.filter(b=>b.departureId===d.id).reduce((s,b)=>s+Number(b.pax||0),0);return `<tr><td>${esc(d.name)}</td><td>${esc(pkgName(d.packageId))}</td><td>${esc(d.date)}</td><td>${esc(d.quota||0)}</td><td>${booked}</td><td>${Number(d.quota||0)-booked}</td></tr>`})))}
function bookings(){return heading('Booking','Pendaftaran booking agent dan pengelolaan pax',btn('+ TAMBAH BOOKING','openBooking()','primary'))+panel('Data Booking',table(['Kode','Agent','Departure','Pax','Harga/Pax','Total','Paid','Outstanding','Status','Aksi'],db.bookings.map(b=>`<tr><td>${esc(b.code)}</td><td>${esc(agentName(b.agentId))}</td><td>${esc(depName(b.departureId))}</td><td>${b.pax}</td><td>${money(b.price)}</td><td>${money(total(b))}</td><td>${money(paid(b))}</td><td>${money(total(b)-paid(b))}</td><td><span class="pill">${esc(b.status||'Booked')}</span></td><td><button class="secondary small" onclick="addParticipantFor('${b.id}')">+ Pax</button> <button class="danger small" onclick="del('bookings','${b.id}')">Hapus</button></td></tr>`)))}
function openBooking(){addForm('Booking',[`<div><label>Agent</label><select name="agentId" required>${selectOpts(db.agents)}</select></div>`,`<div><label>Departure</label><select name="departureId" required>${selectOpts(db.departures,'id','name')}</select></div>`,field('Jumlah Pax','pax','number','1','min="1" required'),field('Harga/Pax','price','number','0'),field('Biaya tambahan','extra','number','0'),field('Diskon total','discount','number','0'),field('Status','status','text','Booked'),field('Catatan','note')],x=>{x.id=uid();x.code='KN-'+String(db.bookings.length+1).padStart(5,'0');db.bookings.push(x)})}
function participants(){return heading('Data Peserta','Data peserta dan passport yang terhubung dengan booking',btn('+ TAMBAH PESERTA','addParticipant()','primary'))+panel('Peserta',table(['Nama','Booking','Passport','Tanggal lahir','Gender','Aksi'],db.participants.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(db.bookings.find(b=>b.id===p.bookingId)?.code||'-')}</td><td>${esc(p.passport||'-')}</td><td>${esc(p.birth||'-')}</td><td>${esc(p.gender||'-')}</td><td><button class="danger small" onclick="del('participants','${p.id}')">Hapus</button></td></tr>`)))}
function addParticipant(){addForm('Peserta',[`<div><label>Booking</label><select name="bookingId">${selectOpts(db.bookings,'id','code')}</select></div>`,field('Nama sesuai passport','name'),field('Passport','passport'),field('Tanggal lahir','birth','date'),field('Gender','gender'),field('Passport expiry','expiry','date'),field('Nationality','nationality','text','Indonesia')],x=>db.participants.push({...x,id:uid()}))}
function addParticipantFor(id){addForm('Peserta',[field('Booking ID','bookingId','text',id,'readonly'),field('Nama sesuai passport','name'),field('Passport','passport'),field('Tanggal lahir','birth','date'),field('Gender','gender'),field('Passport expiry','expiry','date'),field('Nationality','nationality','text','Indonesia')],x=>db.participants.push({...x,id:uid()}))}
function rooms(){return heading('Rooming List','Pengelolaan pembagian kamar',btn('+ TAMBAH ROOM','addRoom()','primary'))+panel('Room Assignment',table(['Booking','Room','Type','Peserta','Catatan','Aksi'],db.rooms.map(r=>`<tr><td>${esc(db.bookings.find(b=>b.id===r.bookingId)?.code||'-')}</td><td>${esc(r.room)}</td><td>${esc(r.type)}</td><td>${esc((r.participantIds||[]).map(id=>db.participants.find(p=>p.id===id)?.name||id).join(', '))}</td><td>${esc(r.note)}</td><td><button class="danger small" onclick="del('rooms','${r.id}')">Hapus</button></td></tr>`)))}
function addRoom(){addForm('Room',[`<div><label>Booking</label><select name="bookingId">${selectOpts(db.bookings,'id','code')}</select></div>`,field('Nomor kamar','room'),field('Tipe kamar','type','text','Twin'),field('Peserta IDs','participantIds','text','','placeholder="Pisahkan ID peserta dengan koma"'),field('Catatan','note')],x=>{x.id=uid();x.participantIds=x.participantIds.split(',').map(s=>s.trim()).filter(Boolean);db.rooms.push(x)})}
function payments(){return heading('Pembayaran','Catat DP, pembayaran tambahan dan pelunasan',btn('+ CATAT PEMBAYARAN','addPayment()','primary'))+panel('Transaksi Pembayaran',table(['Tanggal','Booking','Agent','Nominal','Metode','Referensi','Aksi'],db.payments.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(db.bookings.find(b=>b.id===p.bookingId)?.code||'-')}</td><td>${esc(agentName(db.bookings.find(b=>b.id===p.bookingId)?.agentId))}</td><td>Rp ${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td><button class="danger small" onclick="del('payments','${p.id}')">Hapus</button></td></tr>`)))}
function addPayment(){addForm('Pembayaran',[field('Tanggal','date','date',new Date().toISOString().slice(0,10)),`<div><label>Booking</label><select name="bookingId">${selectOpts(db.bookings,'id','code')}</select></div>`,field('Nominal','amount','number'),field('Metode','method','text','Transfer'),field('Referensi','reference'),field('Catatan','note')],x=>db.payments.push({...x,id:uid()}))}
function invoices(){return heading('Invoice','Generate invoice berdasarkan booking',`<button class="primary" onclick="invoiceSelect()">+ GENERATE INVOICE</button>`)+panel('Booking untuk Invoice',table(['Kode','Agent','Departure','Total','Pembayaran','Outstanding','Invoice'],db.bookings.map(b=>`<tr><td>${esc(b.code)}</td><td>${esc(agentName(b.agentId))}</td><td>${esc(depName(b.departureId))}</td><td>Rp ${money(total(b))}</td><td>Rp ${money(paid(b))}</td><td>Rp ${money(total(b)-paid(b))}</td><td><button class="secondary small" onclick="printInvoice('${b.id}')">Preview / Print</button></td></tr>`)))}
function invoiceSelect(){if(!db.bookings.length)return toast('Belum ada booking');modal('Pilih Booking Invoice',`<select id="invSelect">${selectOpts(db.bookings,'id','code')}</select><div class="actions"><button class="primary" onclick="printInvoice($('#invSelect').value);closeModal()">Buka Invoice</button></div>`)}
function printInvoice(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;let agent=db.agents.find(a=>a.id===b.agentId)||{};let paidamt=paid(b);let content=`<html><head><title>Invoice ${b.code}</title><style>body{font:14px Arial;padding:35px;color:#222}header{display:flex;justify-content:space-between;border-bottom:3px solid #2448b7;padding-bottom:15px}h1{color:#2448b7}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{border:1px solid #ddd;padding:10px}th{background:#f1f4fa}.right{text-align:right}.total{font-size:18px;font-weight:bold}footer{margin-top:50px}</style></head><body><header><div><h1>KONSORSIUM NASIONAL</h1><p>Travel partner with heart</p></div><div><h2>INVOICE</h2><b>${b.code}</b></div></header><p><b>Bill To:</b> ${esc(agent.name||'')}<br>${esc(agent.address||'')}<br>${esc(agent.phone||'')}</p><p><b>Departure:</b> ${esc(depName(b.departureId))}</p><table><tr><th>Deskripsi</th><th>Pax</th><th>Harga/Pax</th><th>Total</th></tr><tr><td>${esc(depName(b.departureId))}</td><td>${b.pax}</td><td>Rp ${money(b.price)}</td><td>Rp ${money(b.price*b.pax)}</td></tr><tr><td colspan="3" class="right">Biaya tambahan</td><td>Rp ${money(b.extra)}</td></tr><tr><td colspan="3" class="right">Diskon</td><td>Rp ${money(b.discount)}</td></tr><tr><td colspan="3" class="right total">TOTAL</td><td class="total">Rp ${money(total(b))}</td></tr><tr><td colspan="3" class="right">Pembayaran</td><td>Rp ${money(paidamt)}</td></tr><tr><td colspan="3" class="right total">OUTSTANDING</td><td class="total">Rp ${money(total(b)-paidamt)}</td></tr></table><h3>Histori Pembayaran</h3><table><tr><th>Tanggal</th><th>Metode</th><th>Referensi</th><th>Nominal</th></tr>${db.payments.filter(p=>p.bookingId===b.id).map(p=>`<tr><td>${p.date}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td>Rp ${money(p.amount)}</td></tr>`).join('')}</table><footer>Terima kasih atas kepercayaan Anda kepada Konsorsium Nasional.</footer><script>window.print()<\/script></body></html>`;let w=window.open('','_blank');if(!w)return toast('Izinkan pop-up untuk cetak invoice');w.document.write(content);w.document.close()}
function reports(){return heading('Report & Export','Rekap operasional departure, booking, peserta dan pembayaran')+`<div class="toolbar">${btn('Export Rekap Booking CSV','exportBookings()')}${btn('Export Peserta CSV','exportParticipants()')}${btn('Export Rooming CSV','exportRooms()')}${btn('Export Pembayaran CSV','exportPayments()')}${btn('Export Departure CSV','exportDepartures()')}</div>`+panel('Ringkasan Keuangan',table(['Nilai Booking','Pembayaran','Outstanding'],[`<tr><td>Rp ${money(db.bookings.reduce((s,b)=>s+total(b),0))}</td><td>Rp ${money(db.payments.reduce((s,p)=>s+Number(p.amount),0))}</td><td>Rp ${money(db.bookings.reduce((s,b)=>s+total(b),0)-db.payments.reduce((s,p)=>s+Number(p.amount),0))}</td></tr>`]))}
function csvExport(rows,name){let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}
function exportBookings(){csvExport([['Kode','Agent','Departure','Pax','Harga/Pax','Extra','Discount','Total','Paid','Outstanding'],...db.bookings.map(b=>[b.code,agentName(b.agentId),depName(b.departureId),b.pax,b.price,b.extra,b.discount,total(b),paid(b),total(b)-paid(b)])],'kn-booking-recap.csv')}
function exportParticipants(){csvExport([['Nama','Booking','Passport','DOB','Gender','Expiry','Nationality'],...db.participants.map(p=>[p.name,db.bookings.find(b=>b.id===p.bookingId)?.code,p.passport,p.birth,p.gender,p.expiry,p.nationality])],'kn-participants.csv')}
function exportRooms(){csvExport([['Booking','Room','Type','Participants','Note'],...db.rooms.map(r=>[db.bookings.find(b=>b.id===r.bookingId)?.code,r.room,r.type,(r.participantIds||[]).map(id=>db.participants.find(p=>p.id===id)?.name||id).join('; '),r.note])],'kn-rooming.csv')}
function exportPayments(){csvExport([['Date','Booking','Agent','Amount','Method','Reference'],...db.payments.map(p=>[p.date,db.bookings.find(b=>b.id===p.bookingId)?.code,agentName(db.bookings.find(b=>b.id===p.bookingId)?.agentId),p.amount,p.method,p.reference])],'kn-payments.csv')}
function exportDepartures(){csvExport([['Departure','Date','Package','Quota','Booked pax','Remaining'],...db.departures.map(d=>[d.name,d.date,pkgName(d.packageId),d.quota,db.bookings.filter(b=>b.departureId===d.id).reduce((s,b)=>s+Number(b.pax),0),Number(d.quota)-db.bookings.filter(b=>b.departureId===d.id).reduce((s,b)=>s+Number(b.pax),0)])],'kn-departures.csv')}
function settings(){return heading('Pengaturan & Backup','Konfigurasi dan pengelolaan backup data')+panel('Profil Sistem',`<form id="settingsForm"><div class="formgrid">${field('Nama perusahaan','company','text',db.settings.company)}${field('Prefix Booking','prefix','text',db.settings.prefix)}${field('Prefix Invoice','invoicePrefix','text',db.settings.invoicePrefix)}</div><div class="actions"><button class="primary">Simpan Pengaturan</button></div></form>`)+panel('Backup & Restore',`<div class="toolbar"><button class="primary" onclick="backup()">Download Backup JSON</button><label class="secondary">Restore JSON <input type="file" id="restoreFile" accept=".json" style="display:inline-block;width:auto"></label></div><p class="muted">Backup menyimpan data sistem pada perangkat ini. Untuk data passport, simpan backup dengan aman.</p><button class="danger" onclick="clearData()">Reset seluruh data</button>`)}
function clearData(){if(confirm('Reset semua data? Pastikan sudah backup.')){db=structuredClone(empty);save()}}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='KN-Portal-Backup.json';a.click()}
function render(){let f={dashboard,agents,airlines,destinations,packages,departures,quota,bookings,participants,rooms,payments,invoices,reports,settings};$('#main').innerHTML=f[page]();if(page==='settings'){ $('#settingsForm').onsubmit=e=>{e.preventDefault();Object.assign(db.settings,Object.fromEntries(new FormData(e.target)));save()};$('#restoreFile').onchange=e=>{let file=e.target.files[0];if(file){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast('Restore berhasil')}catch{toast('File backup tidak valid')}};r.readAsText(file)}}}}
$('#globalSearch').oninput=e=>{let term=e.target.value.toLowerCase();if(!term)return;let match=db.bookings.find(b=>b.code.toLowerCase().includes(term))||db.agents.find(a=>a.name.toLowerCase().includes(term));if(match){if(match.code)nav('bookings');else nav('agents')}};
function addagents(){addForm('Agent',[field('Nama Agent','name'),field('PIC','pic'),field('Telepon','phone'),field('Email','email','email'),field('Alamat','address'),field('Catatan','note')],x=>db.agents.push({...x,id:uid()}))}
render();
</script></body></html>
