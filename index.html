<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking & Invoice Konsorsium Nasional</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sidebar navigasi + area kerja. Warna mengikuti logo TravelKita (biru dan merah). */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface2:#eceff8; --fg:#121a2e; --muted:#59627d; --line:#dce1ee;
  --blue:#1f4fd8; --on-blue:#ffffff; --blue-soft:#e3eaff; --red:#d62839; --red-soft:#fde6e9;
  --ok:#12805c; --ok-soft:#d9f3e8; --warn:#9a5a00; --warn-soft:#fdefd2; --shadow:0 1px 2px rgba(18,26,46,.06),0 4px 14px rgba(18,26,46,.05);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1323; --surface:#151c31; --surface2:#1e2741; --fg:#e8ecf8; --muted:#9aa5c3; --line:#2a3555;
    --blue:#7799ff; --on-blue:#0d1323; --blue-soft:#1b2a55; --red:#ff6d7c; --red-soft:#3b1b23;
    --ok:#52d3a3; --ok-soft:#12342b; --warn:#f2b24f; --warn-soft:#3a2c11; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1323; --surface:#151c31; --surface2:#1e2741; --fg:#e8ecf8; --muted:#9aa5c3; --line:#2a3555;
  --blue:#7799ff; --on-blue:#0d1323; --blue-soft:#1b2a55; --red:#ff6d7c; --red-soft:#3b1b23;
  --ok:#52d3a3; --ok-soft:#12342b; --warn:#f2b24f; --warn-soft:#3a2c11; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:18px;padding-top:4px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--blue);color:var(--on-blue);font:800 18px/36px var(--font-head);text-align:center;position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid var(--bg)}
.brand b{display:block;font:800 16px/1.1 var(--font-head)}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--red-soft);color:var(--red);border-radius:99px;padding:0 7px}
.sidenote{font-size:12px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:24px;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:transparent;background:none}
.btn.danger:hover{background:var(--red-soft)}
.btn.danger[data-armed="1"]{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>.ch h2{font-size:15px}
.card>.cb{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.02em}
.kpi b{display:block;font:800 22px/1.25 var(--font-head);margin-top:4px;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .bad{color:var(--red);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:620px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--surface2)}
.r{text-align:right}
.mut{color:var(--muted)}
.small{font-size:12.5px}
.strong{font-weight:600}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.paid,.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.partial,.pill.confirmed{background:var(--blue-soft);color:var(--blue)}
.pill.unpaid,.pill.draft,.pill.cancel,.pill.cancelled{background:var(--surface2);color:var(--muted)}
.pill.overdue{background:var(--red-soft);color:var(--red)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.filters input,.filters select{min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=search]{flex:1 1 220px;width:auto}
.filters select{width:auto;flex:0 1 170px}
textarea{resize:vertical}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--surface2)}
.li .r{text-align:right;flex:none}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sumbox{display:flex;flex-direction:column;gap:6px}
.sumbox div{display:flex;justify-content:space-between;gap:10px}
.sumbox .tot{font:800 18px var(--font-head);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.sumbox .due{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 10px;font-weight:700}
.sumbox .lunas{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.kv small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,15,30,.55)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.wide{width:min(900px,100%)}
.sheet.xl{width:min(900px,100%);background:var(--surface2)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh h2{font-size:17px}
.sb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sf{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sf .err{margin-right:auto;color:var(--red);font-weight:600;font-size:13px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:8px}
.x:hover{background:var(--surface2)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld.span2{grid-column:span 2}
.fld.full{grid-column:1/-1}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;background:var(--bg)}
.rowcard .wide2{grid-column:span 2}
.rows{display:flex;flex-direction:column;gap:8px}
.hint{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast[hidden]{display:none}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.paperwrap{overflow-x:auto}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;padding-bottom:4px}
  .nav button{padding:8px 11px;white-space:nowrap}
  .sidenote{display:none}
  .detail-grid{grid-template-columns:minmax(0,1fr)}
  .fld.span2{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.logochip{background:#fff;border-radius:12px;padding:6px 10px;border:1px solid var(--line);display:block}
.logochip img{display:block;height:44px;width:auto;max-width:100%}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--blue)}
.pdet{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px}
.pdet summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:12.5px}
.pdet .fgrid{margin-top:8px}
.bulk{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.bulk textarea{flex:1 1 280px;height:72px;min-height:0}
table.t.rk{min-width:1240px;font-size:12.5px}
table.t.rk th,table.t.rk td{padding:7px 10px}
table.t.rk td.c,table.t.rk th.c{text-align:center}
table.t.rk td.fl{text-align:center;font-weight:700;color:#111;white-space:nowrap}
table.t.rk tr.tlrow td{background:var(--warn-soft)}
.fchip{display:flex;gap:8px;align-items:baseline;padding:7px 11px;border-radius:8px;color:#111;font-weight:600;border:1px solid rgba(0,0,0,.18);font-size:13px}
.fchip small{font-weight:800;margin-left:auto;white-space:nowrap}
.rtag{display:inline-block;min-width:64px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px;color:#111;border:1px solid rgba(0,0,0,.18)}
.miss{color:var(--red);font-weight:600}
.warnx{display:block;color:var(--warn);font-size:11.5px;font-weight:600}
.roomrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;background:var(--bg)}
.roomrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.logoprev{max-height:70px;max-width:260px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
table.t td.num{white-space:nowrap}

/* ============ Util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseD=iso=>new Date(iso+'T00:00:00');
const fmtDate=iso=>iso?parseD(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const compact=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M';if(a>=1e6)return (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';if(a>=1e3)return Math.round(n/1e3)+' rb';return String(Math.round(n))};
function terbilang(n){
  n=Math.floor(Math.abs(n));
  const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  const f=n=>{
    if(n<12)return s[n];
    if(n<20)return f(n-10)+' belas';
    if(n<100)return f(Math.floor(n/10))+' puluh'+(n%10?' '+f(n%10):'');
    if(n<200)return 'seratus'+(n%100?' '+f(n%100):'');
    if(n<1000)return f(Math.floor(n/100))+' ratus'+(n%100?' '+f(n%100):'');
    if(n<2000)return 'seribu'+(n%1000?' '+f(n%1000):'');
    if(n<1e6)return f(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+f(n%1e3):'');
    if(n<1e9)return f(Math.floor(n/1e6))+' juta'+(n%1e6?' '+f(n%1e6):'');
    if(n<1e12)return f(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+f(n%1e9):'');
    return f(Math.floor(n/1e12))+' triliun'+(n%1e12?' '+f(n%1e12):'');
  };
  const t=n===0?'nol':f(n);
  return t.charAt(0).toUpperCase()+t.slice(1)+' rupiah';
}
function setPath(o,path,val){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]];}c[k[k.length-1]]=val}

const TERMS_DEF=`SYARAT & KETENTUAN

1. PEMBATALAN: DP & Pembayaran yang sudah masuk tidak dapat dibatalkan/ dipindahtangankan/ dipindahkan jadwal. Jika peserta membatalkan trip maka tidak ada pengembalian.
2. AIRLINES FORCE MAJEURE: Force majure seperti pembatalan / keterlambatan / perubahan peraturan bagasi / hambatan lain penerbangan yg disebabkan oleh pihak maskapai ataupun hal lain, hambatan transportasi lokal, kerusuhan & lain sebagainya, maka pihak travel agent tidak dapat dituntut & segala kerugian yg disebabkan hal tersebut jika ada maka menjadi tanggungan peserta tour. Travel agent akan semampunya membantu komunikasi ke pihak terkait.
3. VISA: Proses persetujuan visa adalah sepenuhnya wewenang kedutaan dan tidak dapat di Intervensi oleh pihak manapun. Hal-hal lain yang berkaitan dengan proses tidak disetujuinya pengajuan visa akan menyesuaikan dengan prosedur yang berlaku dari pihak-pihak terkait. Apabila visa ditolak maka tidak ada pengembalian atas biaya visa, asuransi, DP tour, dan biaya terkait lainnya.
4. IMIGRASI: Imigrasi negara yang dikunjungi memiliki hak untuk menerima dan menolak tamu untuk berkunjung. Apabila ditolak, pihak travel agent tidak bertanggung jawab akan hal ini.
5. LOCAL FORCE MAJEURE: Dalam keadaan Force Majeure/terpaksa/tidak teratasi karena bencana alam, kerusuhan, suasana politik, dan kondisi di luar kendali kami, maka pihak travel agent tidak dapat dituntut atas segala kerugian yang ditimbulkan.
6. Demi kelancaran tour, acara perjalanan dapat berubah tanpa pemberitahuan terlebih dahulu.
7. Dengan melakukan pendaftaran berarti peserta sudah dianggap menyetujui seluruh syarat dan ketentuan yang berlaku.

SYARAT DAN KETENTUAN:
- HARGA PAKET MIN DAFTAR 2 ORG
- PENGATURAN KAMAR AKAN DI PERTIMBANGKAN JENIS KELAMIN, DAN HUBUNGAN KEKELUARGAAAN, JIKA JUMLAH AKHIR PESERTA GANJIL MAKA AKAN DIKENAKAN BIAYA SINGLE SUPPLEMENT.

TERM & CONDITION:
1. PAKET TOUR DI HARGA PROMO (TIDAK BISA CANCEL MAUPUN REFUND)
2. APABILA FORCE MAJOUR, BANDARA TUTUP, PENYAKIT DLL, MENGIKUTI REGULASI MASKAPAI DAN BIAYA YANG TIMBUL MENJADI TANGGUNGAN PESERTA.

PENDAFTARAN & PEMBATALAN:
1. PENDAFTARAN MINIMAL DP 3.000.000/ORG, PELUNASAN MAX H-20 SEBELUM BERANGKAT
2. PENDAFTARAN 30 HARI SEBELUM TANGGAL KEBERANGKATAN AKAN DI MINTA UNTUK BAYAR SEPENUHNYA
3. APABILA VISA DI TOLAK OLEH KEDUTAAN YANG BERSANGKUTAN MAKA BIAYA VISA DAN PEMBATALAN TOUR TETAP DI BEBANKAN KEPADA PESERTA
4. COPY PASPORT PESERTA TOUR HARUS DIKIRIMKAN SAAT DP
5. DENGAN MEMBAYAR UANG MUKA PENDAFTARAN TOUR, PESERTA DI ANGGAP TELAH MEMAHAMI DAN MENERIMA SELURUH KETENTUAN YANG BERLAKU
6. PESERTA TOUR YANG SEDANG HAMIL DIHARUSKAN MEMBAWA ATAU MELAMPIRKAN SURAT KETERANGAN DOKTER.
7. TOUR LEADER BERHAK MEMINTA PESERTA TOUR KELUAR DARI ROMBONGAN (GROUP) APABILA PESERTA TERSEBUT DIANGGAP MENGGANGGU KETERTIBAN DAN KENYAMANAN ROMBONGAN.`;

  if(is3){if(n===6)return T_37;if(n===7)return T_38;if(/BANGKOK|PATTAYA/.test(t))return T_38;if(/HAT\s?YAI|HATYAI/.test(t))return T_37;return null}

function calc(b){
  const items=b.items||[],pax=paxOf(b);
  const paxTotal=pax.reduce((a,p)=>a+pxPrice(b,p),0);
  const itemsTotal=items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
  const subtotal=paxTotal+itemsTotal;
  const cost=pax.length*num(b.pkgCost)+items.reduce((a,i)=>a+num(i.qty)*num(i.cost),0);
  const tips=num(b.tipsPerPax)*pax.length;
  const gross=subtotal+tips;
  const discPer=num(b.discPerPax);
  const discount=discPer*pax.length+num(b.discount);
  const base=Math.max(0,subtotal-discount);
  const taxBase=(b.discMode==='after'?subtotal:base)+(String(b.tipsTaxable)==='1'?tips:0);
  const tax=Math.round(taxBase*num(b.taxPct)/100);
  const admin=num(b.adminFee);
  const total=base+tax+admin+tips;
  const paid=(b.payments||[]).reduce((a,p)=>a+num(p.amount),0);
  return {paxTotal,itemsTotal,subtotal,tips,gross,cost,discount,discPer,base,taxBase,tax,admin,total,paid,balance:total-paid,margin:base-cost+admin};
}

async function htmlToPdf(html){
  await loadPdfLibs();
  const fr=document.createElement('iframe');
  fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0;visibility:hidden';
  document.body.appendChild(fr);
  try{
    const css='<style>body{background:#fff!important;padding:0!important;margin:0!important}.bar{display:none!important}.paper{box-shadow:none!important;margin:0!important;max-width:none!important;width:794px!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style>';
    await new Promise(r=>{fr.onload=r;fr.srcdoc=html.replace('</head>',css+'</head>')});
    const d=fr.contentDocument;
    try{await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
    await Promise.all(Array.from(d.images).map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})));
    fr.style.height=Math.max(1200,d.documentElement.scrollHeight+40)+'px';
    const paper=d.querySelector('.paper')||d.body,SC=2;
    const cv=await html2canvas(paper,{scale:SC,backgroundColor:'#fff',useCORS:true,logging:false,windowWidth:794});
    const terms=paper.querySelector('.terms');
    const pr=paper.getBoundingClientRect();
    const cuts=[0];if(terms){const y=Math.round((terms.getBoundingClientRect().top-pr.top)*SC);if(y>40&&y<cv.height-40)cuts.push(y)}
    cuts.push(cv.height);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    const PW=210,PH=297,M=8,CW=PW-2*M,CH=PH-2*M;let first=true;
    for(let k=0;k<cuts.length-1;k++){
      const y0=cuts[k],y1=cuts[k+1],hpx=y1-y0;if(hpx<4)continue;
      const mm=hpx/cv.width*CW;               // tinggi bila lebar = CW
      if(mm<=CH*1.12){                          // muat satu halaman (kecilkan sedikit bila perlu)
        const f=Math.min(1,CH/mm),w=CW*f,h=mm*f;
        const c=document.createElement('canvas');c.width=cv.width;c.height=hpx;c.getContext('2d').drawImage(cv,0,y0,cv.width,hpx,0,0,cv.width,hpx);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',M+(CW-w)/2,M,w,h);
      }else{                                    // terlalu panjang: potong per halaman
        const sl=Math.floor(CH/CW*cv.width);
        for(let y=y0;y<y1;y+=sl){
          const hh=Math.min(sl,y1-y),c=document.createElement('canvas');c.width=cv.width;c.height=hh;c.getContext('2d').drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh);
          if(!first)pdf.addPage();first=false;
          pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',M,M,CW,hh/cv.width*CW);
        }
      }
    }
    return pdf.output('arraybuffer');
  }finally{fr.remove()}
}
async function saveFile(filename,data){
  if(/^cadangan-/.test(filename)){try{localStorage.setItem('kn-lastbackup',String(Date.now()))}catch(e){}}
  if(/\.html$/.test(filename)&&typeof data==='string'&&data.indexOf('class="paper')>=0){
    try{
      toast('Membuat PDF...');
      const buf=await htmlToPdf(data),pn=filename.replace(/\.html$/,'.pdf');
      if(DL){try{await DL.save({filename:pn,data:new Uint8Array(buf)});toast('PDF siap disimpan')}catch(e){if(!(e&&e.code==='declined'))toast('Gagal mengunduh: '+((e&&(e.message||e.code))||''))}return}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));a.download=pn;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('PDF diunduh: '+pn);return;
    }catch(e){toast('PDF gagal dibuat ('+((e&&e.message)||'')+'). Mengunduh versi HTML.')}
  }
  if(!DL){
    try{
      const blob=new Blob([data],{type:/\.json$/.test(filename)?'application/json':/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.xlsx$/.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/html;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('File diunduh: '+filename);
    }catch(e){toast('Gagal mengunduh file')}
    return;
  }
  try{await DL.save({filename,data});toast('File siap disimpan')}catch(e){if(e&&e.code==='declined')return;toast('Gagal mengunduh: '+((e&&(e.message||e.code))||''))}
}

function buildXlsx(ids){
  const wb=new XBook();
  const s1=wb.sheet('PASPORLIST',[6,46,14,12,12,14,14,40,14,40,16,11,22]);
  const s2=wb.sheet('PASSPORTLIST + ROOMLIST',[6,46,14,12,12,14,14,40,14,40,16,11,22,20]);
  const nightsMax=Math.max(0,...ids.map(i=>{const d=S.departures[i];return d.departDate&&d.returnDate?Math.min(21,Math.max(0,diffDays(d.returnDate,d.departDate))):0}));
  const w3=[6,46,12,20];for(let i=0;i<nightsMax;i++)w3.push(9);w3.push(34);
  const s3=wb.sheet('ROOMLIST',w3);
  let r1=1,r2=1,r3=1;
  ids.forEach(id=>{
    const I=xInfo(id),{d,rows,tl,plan,col,per,dur,name}=I;
    /* Sheet 1: daftar paspor + ringkasan penerbangan */
    wb.merge(s1,r1,1,r1,13,'DATA '+name+(per?' ('+per+')':''),{b:1,sz:16,al:'center'});s1.heights[r1]=28;r1++;
    PH.forEach((h,i)=>wb.set(s1,r1,i+1,h,xHead));r1++;
    rows.forEach((x,i)=>{xPassRow(wb,s1,r1,i+1,x,col);r1++});
    if(tl){xPassRow(wb,s1,r1,'TL',tl,col);r1++}
    r1++;
    [['KEBERANGKATAN :','out'],['KEPULANGAN :','in']].forEach(([lbl,dir])=>{
      wb.set(s1,r1,2,lbl,{b:1});r1+=2;
      flightGroups(rows,dir).forEach(g=>{wb.merge(s1,r1,2,r1,5,g.k+' ('+g.n+' PAX)',{b:1,al:'center',bd:'thin',fill:'66FFFF'});r1++});
      r1++;
    });
    if(d.notes){wb.merge(s1,r1,2,r1,13,'CATATAN : '+d.notes,{b:1,al:'left',wrap:1});s1.heights[r1]=32;r1+=2}
    r1+=2;
    /* Sheet 2: paspor + kamar (urut sesuai kamar) */
    wb.merge(s2,r2,1,r2,14,'PASSPORTLIST & ROOMLIST '+name+(dur?' '+dur:'')+(per?' PERIODE '+per:''),{b:1,sz:18,al:'center',fill:'FFFF00'});s2.heights[r2]=30;r2++;
    PH.concat(['ROOMLIST']).forEach((h,i)=>wb.set(s2,r2,i+1,h,xHead));r2++;
    let n=0;
    plan.groups.forEach(g=>{
      const start=r2;
      g.rows.forEach(x=>{xPassRow(wb,s2,r2,++n,x,col);r2++});
      wb.merge(s2,start,14,r2-1,14,g.room.type,{b:1,al:'center',bd:'thin',fill:ROOM_COL[g.room.type]||'FFFFFF'});
    });
    plan.free.forEach(x=>{xPassRow(wb,s2,r2,++n,x,col);wb.set(s2,r2,14,'',xT);r2++});
    if(tl){xPassRow(wb,s2,r2,'TL',tl,col);wb.set(s2,r2,14,'',xT);r2++}
    r2+=3;
    /* Sheet 3: rooming list */
    const nights=d.departDate&&d.returnDate?Math.min(21,Math.max(0,diffDays(d.returnDate,d.departDate))):0,last=4+nights+1;
    wb.merge(s3,r3,1,r3,last,'ROOMING LIST '+name+(per?' PERIODE '+per:''),{b:1,sz:16,al:'center'});s3.heights[r3]=28;r3++;
    ['NO','NAMA','FAMILY','ROOM'].forEach((h,i)=>wb.set(s3,r3,i+1,h,xHead));
    for(let i=0;i<nights;i++)wb.set(s3,r3,5+i,{d:addDays(d.departDate,i)},{...xHead,nf:16});
    wb.set(s3,r3,last,'CATATAN',xHead);r3++;
    n=0;
    plan.groups.forEach(g=>{
      const start=r3,end=r3+g.rows.length-1;
      g.rows.forEach(x=>{wb.set(s3,r3,1,++n,xT);wb.set(s3,r3,2,x.name,xN);r3++});
      wb.merge(s3,start,3,end,3,g.room.family||'',{b:1,al:'center',bd:'thin'});
      wb.merge(s3,start,4,end,4,g.room.type,{b:1,al:'center',bd:'thin',fill:ROOM_COL[g.room.type]||'FFFFFF'});
      for(let i=0;i<nights;i++)wb.merge(s3,start,5+i,end,5+i,'',xT);
      wb.merge(s3,start,last,end,last,g.room.note||'',{al:'left',bd:'thin',wrap:1});
    });
    plan.free.forEach(x=>{wb.set(s3,r3,1,++n,xT);wb.set(s3,r3,2,x.name,xN);wb.set(s3,r3,3,'',xT);wb.set(s3,r3,4,'BELUM DAPAT KAMAR',{...xT,color:'C00000',b:1});for(let i=0;i<nights;i++)wb.set(s3,r3,5+i,'',xT);wb.set(s3,r3,last,'',xT);r3++});
    if(tl){wb.set(s3,r3,1,'TL',{...xT,b:1,fill:'FFFF00'});wb.set(s3,r3,2,tl.name,xN);wb.set(s3,r3,3,'',xT);wb.set(s3,r3,4,'',xT);for(let i=0;i<nights;i++)wb.set(s3,r3,5+i,'',xT);wb.set(s3,r3,last,'',xT);r3++}
    r3++;
    ROOM_SUM.filter(t=>t!=='TRIPLE'||plan.counts[t]).forEach(t=>{wb.merge(s3,r3,3,r3,4,t+' : '+plan.counts[t],{b:1,bd:'medium',fill:ROOM_COL[t]});r3++});
    wb.merge(s3,r3,3,r3,4,'TOTAL KAMAR : '+plan.total,{b:1,bd:'medium',fill:'D9D9D9'});r3+=4;
  });
  return wb.build();
}
function exportRekap(ids,expand){

  const roots=[...new Set([...set].map(groupOf))].sort((a,b)=>(S.departures[a].departDate||'').localeCompare(S.departures[b].departDate||''));

  const nav=NAV.filter(n=>navOK(n[0])).map(([k,l])=>'<button data-act="nav" data-r="'+k+'"'+(ui.route===k?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'+esc(l)+(k==='booking'&&od?'<span class="cnt" title="Invoice jatuh tempo">'+od+'</span>':'')+'</button>').join('');
  const note=S.mode==='db'?'Data tersimpan di cloud dan tersinkron antar pengguna secara langsung.':'Mode lokal: data hanya tersimpan di browser ini. Buka lewat tautan artifact yang sudah dipublikasikan agar data tersimpan di cloud.';
  return '<aside class="side"><div class="brand">'+(st.logo?'<div class="logochip"><img src="'+esc(st.logo)+'" alt="'+esc(st.name)+'"></div>':'<div class="mark">'+esc((st.name||'T').charAt(0).toUpperCase())+'</div><div><b>'+esc(st.name)+'</b><small>'+esc(st.tagline)+'</small></div>')+'</div><nav class="nav" aria-label="Menu utama">'+nav+'</nav>'+userChip()+'<div class="sidenote">'+note+'</div></aside><main class="main">'+bkBanner()+inner+'</main>';

function render(force){
  const app=$('#app');if(!app)return;
  if(S.authMode&&S.authState!=='ok'){if(!force&&$('#loginForm'))return;app.innerHTML=S.authState==='init'?'<div class="loginwrap"><div class="logincard"><h1>Memuat...</h1></div></div>':vFbAuth();return}
  if(!S.loaded){app.innerHTML=shell('<div class="empty card"><h3>'+(S.slow?'Data belum bisa dijangkau':'Memuat data')+'</h3>'+(S.slow?'Periksa koneksi internet. Halaman akan terisi sendiri begitu data tersedia.':'Sebentar ya.')+'</div>');return}
  if(!meU()){if(S.authMode){S.authState='blocked';S.authMsg='Akun Anda tidak terdaftar atau dinonaktifkan. Hubungi admin.';app.innerHTML=vFbAuth();return}if(!force&&$('#loginForm'))return;app.innerHTML=vLogin();return}
  if(!navOK(ui.route))ui.route='dashboard';
  if(ui.route==='pengaturan'&&ui.dirty&&!force)return;
  const V={dashboard:vDashboard,rekap:()=>ui.depId&&S.departures[ui.depId]?vDeparture(ui.depId):vRekap(),booking:()=>ui.bookingId&&S.bookings[ui.bookingId]?vDetail(ui.bookingId):vBookings(),kuota:vKuota,pelanggan:vCustomers,katalog:vCatalog,laporan:vReports,pengguna:vUsers,pengaturan:vSettings};
  app.innerHTML=shell(V[ui.route]());
  if(ui.route==='pengaturan'){FORM={D:clone(S.settings),settings:true}}
}

    +'<div class="card"><div class="empty"><h3>Belum ada data</h3><p>Mulai dengan melengkapi profil perusahaan di Pengaturan, lalu tambahkan pelanggan dan buat booking pertama. Atau isi data contoh dulu untuk melihat seluruh alur.</p><div class="row"><button class="btn primary" data-act="new-booking">Buat booking pertama</button><button class="btn" data-act="seed">Isi data contoh</button><button class="btn" data-act="nav" data-r="pengaturan">Buka Pengaturan</button></div></div></div>';
  }
  const monthBill=act.filter(x=>(x.b.invoiceDate||'').slice(0,7)===ym).reduce((a,x)=>a+x.c.total,0);
  let monthRecv=0;B.forEach(x=>(x.b.payments||[]).forEach(p=>{if((p.date||'').slice(0,7)===ym)monthRecv+=num(p.amount)}));
  const out=act.filter(x=>x.c.balance>0),outTotal=out.reduce((a,x)=>a+x.c.balance,0);
  const late=out.filter(x=>x.b.dueDate&&x.b.dueDate<t);
  const up=act.filter(x=>x.b.departDate&&x.b.departDate>=t&&x.b.departDate<=addDays(t,30)).sort((a,b)=>a.b.departDate.localeCompare(b.b.departDate));
  // 6 bulan terakhir
  const months=[];const d0=new Date();d0.setDate(1);
  for(let i=5;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);months.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:d.toLocaleDateString('id-ID',{month:'short'}),bill:0,recv:0})}

  +(recent.length?'<div class="tablewrap"><table class="t" style="min-width:760px"><thead><tr><th>Customer</th><th>Tour paket</th><th>Status</th><th>Bayar</th><th class="r">Nominal</th></tr></thead><tbody>'
  +recent.map(x=>{const p=payState(x.b);return '<tr class="click" data-act="open" data-id="'+x.id+'"><td><span class="strong">'+esc(custName(x.b.customerId))+'</span><div class="small mut">'+esc(x.b.code||x.b.invoiceNo||'')+(x.b.createdByName?' &middot; oleh '+esc(x.b.createdByName):'')+'</div></td>'
    +'<td><span class="strong">'+esc(tourTitle(x.b)||'-')+'</span><div class="small mut">'+(x.b.departDate?fmtDate(x.b.departDate):'')+'</div></td>'
    +'<td>'+pill(x.b.status==='completed'?'completed':x.b.status==='confirmed'?'confirmed':x.b.status==='cancelled'?'cancelled':'draft',BSTAT[x.b.status]||x.b.status)+'</td><td>'+pill(p.k,p.l)+'</td><td class="r num strong">'+rp(x.c.total)+'</td></tr>'}).join('')
  +'</tbody></table></div>':'<div class="empty">Belum ada reservasi.</div>')+'</div>';

  return '<div class="pagehead"><div><h1>Dashboard</h1><p>Ringkasan per '+fmtDate(t)+'</p></div><div class="row"><button class="btn primary" data-act="new-booking">+ Booking baru</button></div></div>'
  +'<div class="kpis">'
  +'<div class="card kpi"><small>Tagihan bulan ini</small><b class="num">'+rp(monthBill)+'</b><span>invoice terbit di bulan berjalan</span></div>'
  +'<div class="card kpi"><small>Diterima bulan ini</small><b class="num">'+rp(monthRecv)+'</b><span>pembayaran yang dicatat</span></div>'

  +(up.length?'<div class="list">'+up.slice(0,6).map(x=>'<div class="li" data-act="open" data-id="'+x.id+'"><div class="stack"><span class="strong">'+esc(x.b.destination||'-')+'</span><span class="small mut">'+esc(custName(x.b.customerId))+' &middot; '+(x.b.passengers||[]).length+' peserta</span></div><div class="r stack"><span class="strong">'+fmtDate(x.b.departDate)+'</span><span class="small mut">'+diffDays(x.b.departDate,t)+' hari lagi</span></div></div>').join('')+'</div>':'<div class="empty">Tidak ada keberangkatan dalam 30 hari.</div>')

function chart(ms){
  const max=Math.max(1,...ms.map(m=>Math.max(m.bill,m.recv)));
  const pw=Math.pow(10,Math.floor(Math.log10(max)));let nice=Math.ceil(max/pw)*pw;if(nice/pw>5&&nice/pw<=7)nice=7*pw;
  const W=640,H=230,L=52,R=8,T=12,Bm=28,iw=W-L-R,ih=H-T-Bm,gw=iw/ms.length,bw=Math.min(26,gw/3);
  let g='';
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+compact(nice*i/4)+'</text>'}
  ms.forEach((m,i)=>{
    const cx=L+gw*i+gw/2,h1=ih*m.bill/nice,h2=ih*Math.max(0,m.recv)/nice;
    g+='<rect x="'+(cx-bw-2)+'" y="'+(T+ih-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="var(--blue)"><title>'+esc(m.l+' tagihan '+rp(m.bill))+'</title></rect>';
    g+='<rect x="'+(cx+2)+'" y="'+(T+ih-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="var(--ok)"><title>'+esc(m.l+' diterima '+rp(m.recv))+'</title></rect>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(m.l)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik tagihan dan penerimaan 6 bulan terakhir">'+g+'</svg>';
}

function tBookings(){
  const q=ui.q.trim().toLowerCase();
  const rows=bookingsArr().filter(x=>{
    if(ui.fStatus&&x.b.status!==ui.fStatus)return false;
    if(ui.fPay&&payState(x.b).k!==ui.fPay)return false;
    if(ui.fBy&&(x.b.createdBy||'')!==ui.fBy)return false;
    if(q&&!([x.b.code,x.b.invoiceNo,custName(x.b.customerId),x.b.destination,x.b.createdByName].join(' ').toLowerCase().includes(q)))return false;
    return true;
  });
  if(!rows.length)return '<div class="empty"><h3>'+(Object.keys(S.bookings).length?'Tidak ada hasil':'Belum ada booking')+'</h3>'+(Object.keys(S.bookings).length?'Ubah kata kunci atau filter.':'Klik "Booking baru" untuk membuat booking dan invoice pertama.')+'</div>';
  return '<table class="t"><thead><tr><th>Invoice</th><th>Pelanggan</th><th>Perjalanan</th><th>Dibuat oleh</th><th class="r">Total</th><th class="r">Sisa</th><th>Status</th></tr></thead><tbody>'
  +rows.map(x=>{const p=payState(x.b);return '<tr class="click" data-act="open" data-id="'+x.id+'"><td><span class="strong">'+esc(x.b.invoiceNo)+'</span><div class="small mut">'+esc(x.b.code)+' &middot; '+fmtDate(x.b.invoiceDate)+'</div></td><td>'+esc(custName(x.b.customerId))+'</td><td>'+esc(x.b.destination||'-')+'<div class="small mut">'+(x.b.departDate?fmtDate(x.b.departDate):'tanggal belum diisi')+'</div></td><td>'+esc(x.b.createdByName||'-')+'</td><td class="r num">'+rp(x.c.total)+'</td><td class="r num">'+(x.b.status==='cancelled'?'-':rp(Math.max(0,x.c.balance)))+'</td><td><div class="stack" style="align-items:flex-start">'+pill(x.b.status,BSTAT[x.b.status]||x.b.status)+pill(p.k,p.l)+'</div></td></tr>'}).join('')

function openBookingForm(id){
  const editing=!!id;

  if(editing){
    D.id=id;D.items=D.items||[];D.items.forEach(i=>{if(i.catId===undefined)i.catId=''});
    D.fl={...blankFl(),...(D.fl||{})};

    ['pkgPrice','pkgCost','tipsPerPax','discPerPax'].forEach(k=>{if(D[k]===undefined)D[k]=0});

function updateQuota(){
  const el=$('#qinfo');if(!el||!FORM)return;const D=FORM.D;
  if(!D.departureId||!S.departures[D.departureId]){el.innerHTML='';return}
  const q=quotaInfo(D.departureId);
  if(!q.has){el.innerHTML='<div class="hint">Kuota keberangkatan ini belum diatur (Rekap Keberangkatan &gt; Atur kuota).</div>';return}
  const gn=S.departures[q.root].name,others=groupSeats(q.root,D.id||null),mine=holdsSeat(D)?paxOf(D).length:0,left=q.quota-others-mine;
  if(!holdsSeat(D)){el.innerHTML='<div class="banner">Status '+esc(BSTAT[D.status]||D.status)+' tidak memakai kursi. Sisa kuota '+esc(gn)+' saat ini: '+(q.quota-others)+' kursi (hanya booking Dikonfirmasi dan Selesai yang mengurangi kuota).</div>';return}
  const old=others,used=others+mine;
  el.innerHTML=left<0?'<div class="banner" style="background:var(--red-soft);color:var(--red)">Kursi tidak cukup di '+esc(gn)+': sisa '+Math.max(0,q.quota-others)+' kursi, booking ini '+mine+' peserta. Tidak bisa disimpan sebagai Dikonfirmasi.</div>'
    :'<div class="banner" style="'+(left===0?'':'background:var(--ok-soft);color:var(--ok)')+'">Kuota '+esc(gn)+(q.parts.length>1?' (dipakai bersama '+q.parts.length+' program)':'')+': sisa '+left+' kursi setelah booking ini ('+used+' dari '+q.quota+' terisi).</div>';
}

function genCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ';const used=new Set(Object.values(S.bookings).map(b=>b.code));
  for(let k=0;k<200;k++){let s='';for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];if(!used.has(s))return s}
  return 'BK'+Date.now().toString(36).toUpperCase().slice(-5);
}
async function saveBooking(){
  const D=FORM.D,err=m=>{const e=$('#ferr');if(e)e.textContent=m};
  if(!D.customerId)return err('Pilih pelanggan terlebih dahulu.');
  if(D.customerId==='__new'&&!D.newCust.name.trim())return err('Isi nama pelanggan baru.');
  const items=D.items.filter(i=>(i.desc||'').trim());
  const pax=paxOf(D);
  if(!items.length&&!pax.length)return err('Isi minimal satu peserta atau satu biaya tambahan.');
  if(items.some(i=>num(i.qty)<=0))return err('Jumlah (qty) biaya tambahan harus lebih dari 0.');
  if(D.departDate&&D.returnDate&&D.returnDate<D.departDate)return err('Tanggal pulang tidak boleh sebelum tanggal berangkat.');
  if(!D.invoiceDate)return err('Tanggal invoice wajib diisi.');
  {const g=seatGuard({...D,passengers:pax},D.id||null);if(g)return err(g)}
  await safe(async()=>{
    let cid=D.customerId;
    if(cid==='__new'){cid=uid();await put('customers',cid,{name:D.newCust.name.trim(),type:'Agen / Mitra',phone:D.newCust.phone,email:D.newCust.email,address:'',idNo:'',notes:'',createdAt:Date.now()})}
    const rec={...D,customerId:cid,
      items:items.map(i=>({desc:i.desc.trim(),type:i.type,qty:num(i.qty),price:num(i.price),cost:num(i.cost),catId:i.catId||''})),
      passengers:pax.map(p=>{const q={...p,name:p.name.trim()};if(q.price===''||q.price==null)delete q.price;else q.price=num(q.price);return q})};
    const id=D.id||uid();
    delete rec.newCust;delete rec.dp;delete rec.id;
    rec.destination=tourTitle(rec)||rec.destination;
    rec.code=(D.code||'').trim().toUpperCase()||genCode();
    if(!D.id){
      rec.invoiceNo=await allocInvoiceNo(rec.invoiceDate);rec.createdAt=Date.now();rec.payments=[];{const m=stamp();rec.createdBy=m.by;rec.createdByName=m.byName}
      if(D.dp&&num(D.dp.amount)>0)rec.payments.push({id:uid(),date:D.dp.date||rec.invoiceDate,method:D.dp.method,amount:num(D.dp.amount),ref:D.dp.ref||'',note:'Pembayaran awal / DP'});
    }
    {const m=stamp();rec.updatedBy=m.by;rec.updatedByName=m.byName;rec.updatedAt=Date.now()}
    const prev=D.id?S.bookings[D.id]:null;
    if(holdsSeat(rec)&&(!prev||!holdsSeat(prev)||prev.departureId!==rec.departureId||paxOf(rec).length>paxOf(prev).length))rec.seatAt=Date.now();
    else rec.seatAt=(prev&&prev.seatAt)||rec.createdAt||Date.now();
    const prevCopy=prev?clone(prev):null;
    await put('bookings',id,rec);
    if(!(await seatVerify(id,rec))){
      if(prevCopy)await put('bookings',id,prevCopy);else await del('bookings',id);
      err('Kursi baru saja diambil booking lain. Kuota sudah penuh, booking ini tidak disimpan. Muat ulang dan cek sisa kursi.');return;
    }
    closeModal();ui.route='booking';ui.bookingId=id;try{history.replaceState(null,'','#booking')}catch(e){}render(true);window.scrollTo(0,0);
    toast(D.id?'Booking diperbarui':'Booking dan invoice dibuat: '+rec.invoiceNo);
  });
}

function openPayForm(id){
  const b=S.bookings[id],c=calc(b);
  const D={date:todayISO(),kind:'in',method:'Transfer Bank',amount:Math.max(0,c.balance),ref:'',note:''};
  FORM={D,modal:true,onChange:null};
  openModal('<div class="sh"><h2>Catat pembayaran</h2><button class="x" data-act="close" aria-label="Tutup">&times;</button></div><div class="sb"><p class="hint">Invoice '+esc(b.invoiceNo)+' &middot; total '+rp(c.total)+' &middot; sisa '+rp(Math.max(0,c.balance))+'</p><div class="fgrid">'
  +fld('Tanggal',inp('date',D.date,{type:'date'}))+fld('Jenis',sel('kind',D.kind,[['in','Pembayaran masuk'],['refund','Refund ke pelanggan']]))
  +fld('Metode',sel('method',D.method,METHODS))+fld('Jumlah (Rp) *',inp('amount',nz(D.amount),{type:'number',min:0}))
  +fld('No. referensi / bukti transfer',inp('ref',''),'span2')+fld('Catatan',inp('note',''),'full')
  +'</div></div><div class="sf"><span class="err" id="ferr"></span><button class="btn" data-act="close">Batal</button><button class="btn primary" data-act="save-pay" data-id="'+id+'">Simpan pembayaran</button></div>');
}
async function savePay(id){
  const D=FORM.D,amt=num(D.amount);
  if(amt<=0){$('#ferr').textContent='Isi jumlah lebih dari 0.';return}
  if(!D.date){$('#ferr').textContent='Tanggal wajib diisi.';return}
  await safe(async()=>{
    const b=clone(S.bookings[id]);b.payments=b.payments||[];
    b.payments.push({id:uid(),date:D.date,method:D.method,amount:D.kind==='refund'?-amt:amt,ref:D.ref,note:D.note,byName:stamp().byName});
    await put('bookings',id,b);closeModal();toast('Pembayaran dicatat');
    const c=calc(b);if(c.balance<=0)toast('Invoice '+b.invoiceNo+' lunas');
  });
}

function termsHTML(t){

    if(/^[A-Z][A-Z &\/]{3,}:?$/.test(l))return '<div class="th">'+esc(l)+'</div>';

    return '<div class="tl">'+esc(l)+'</div>';
  }).join('');
}
function bankHTML(t){

function payLabel(b,i){
  const ps=b.payments||[],p=ps[i];
  if(num(p.amount)<0)return 'Refund';
  const cum=ps.slice(0,i+1).reduce((a,x)=>a+num(x.amount),0),tot=calc(b).total;
  if(i===0)return cum>=tot&&tot>0?'Pembayaran':'DP';
  return cum>=tot&&tot>0?'Pelunasan':'Pembayaran '+(i+1);
}

function invoiceText(id){
  const b=S.bookings[id],c=calc(b),st=S.settings;
  const L=['*'+(b.status==='draft'?'PROFORMA':'INVOICE')+' '+st.name+'*',b.invoiceNo+' · Kode '+b.code,'',
    'Kepada: '+custName(b.customerId),'Paket: '+(tourTitle(b)||'-')];
  const per=periodText(b);if(per&&per!=='-')L.push('Periode: '+per+(b.startCity&&b.startCity.trim()?' (Start '+b.startCity.trim()+')':''));
  L.push('','Rincian:');
  const pax=paxOf(b);
  if(isPaxPriced(b)){
    const groups={};pax.forEach(p=>{const k=pxPrice(b,p);groups[k]=(groups[k]||0)+1});
    Object.entries(groups).forEach(([k,n])=>L.push('- Peserta '+n+' pax x '+rp(k)+' = '+rp(n*k)));
  }else if(pax.length)L.push('- Peserta: '+pax.length+' pax');
  (b.items||[]).forEach(i=>L.push('- '+i.desc+' ('+num(i.qty)+' x '+rp(i.price)+') = '+rp(num(i.qty)*num(i.price))));
  if(c.tips)L.push('- Tips (non pajak) '+pax.length+' x '+rp(b.tipsPerPax)+' = '+rp(c.tips));
  if(c.discount)L.push(discLabel(b,false)+discDetail(b)+': -'+rp(c.discount));if(c.tax)L.push('Pajak '+pctS(b.taxPct)+'%: '+rp(c.tax));if(c.admin)L.push('Biaya admin: '+rp(c.admin));
  L.push('','*Total: '+rp(c.total)+'*');if(c.paid)L.push('Sudah dibayar: '+rp(c.paid));
  L.push(c.balance>0?'*Sisa tagihan: '+rp(c.balance)+'*':'Status: LUNAS');
  if(c.balance>0&&b.dueDate)L.push('Pelunasan paling lambat: '+fmtLong(b.dueDate));
  if(c.balance>0&&st.banks)L.push('','Pembayaran ke:',st.banks);
  L.push('','Terima kasih telah mempercayakan perjalanan Anda kepada '+st.name+'.');
  return L.join('\n');
}

function tlRow(dep){

function roomPlan(dep,rows){
  const byKey=new Map(rows.map(r=>[r.key,r])),used=new Set(),groups=[];
  (dep.rooms||[]).forEach(rm=>{
    const rs=(rm.pids||[]).map(k=>byKey.get(k)).filter(r=>r&&!used.has(r.key));
    rs.forEach(r=>used.add(r.key));
    if(rs.length)groups.push({room:rm,rows:rs});
  });
  const free=rows.filter(r=>!used.has(r.key));
  const counts={};ROOM_TYPES.forEach(t=>counts[t]=0);groups.forEach(g=>{counts[g.room.type]=(counts[g.room.type]||0)+1});
  return {groups,free,counts,total:groups.length};
}

  return m;
}

function rkParse(raw){

  if(h=/\s(\d{4})-(\d{1,2})-(\d{1,2})(?=\s)/.exec(s)){F.y=+h[1];F.m=+h[2]-1;F.d=+h[3];s=s.replace(h[0],' ')}
  else if(h=/\s(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?(?=\s)/.exec(s)){F.d=+h[1];F.m=+h[2]-1;if(h[3]){F.y=+h[3];if(F.y<100)F.y+=2000}s=s.replace(h[0],' ')}
  else if(h=new RegExp('\\s(\\d{1,2})\\s*('+RK_NAMES+')(?:\\s+(\\d{4}))?(?=\\s)').exec(s)){F.d=+h[1];F.m=RK_MON[h[2]];if(h[3])F.y=+h[3];s=s.replace(h[0],' ')}
  else if(h=new RegExp('\\s('+RK_NAMES+')(?:\\s+(\\d{4}))?(?=\\s)').exec(s)){F.m=RK_MON[h[1]];if(h[2])F.y=+h[2];s=s.replace(h[0],' ')}

function rkActive(P){return !!(P.words.length||P.F.d!=null||P.F.m!=null||P.F.y!=null)}
function rkMatch(d,P){

  if(F.m!=null&&(!A||A.m!==F.m))return false;

const sha256=(()=>{
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const W=new Array(64);
  return function(str){
    const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;
    b.push(0x80);while(b.length%64!==56)b.push(0);
    for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
    let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const R=(x,n)=>(x>>>n)|(x<<(32-n));
    for(let o=0;o<b.length;o+=64){
      for(let i=0;i<16;i++)W[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
      for(let i=16;i<64;i++){const a=W[i-15],c=W[i-2];W[i]=(W[i-16]+(R(a,7)^R(a,18)^(a>>>3))+W[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
      let [a,bb,c,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){
        const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&bb)^(a&c)^(bb&c)))|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
      }
      h=[(h[0]+a)|0,(h[1]+bb)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
    }
    return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
  };
})();
function hashPw(salt,pw){let h=sha256(salt+':'+pw);for(let i=0;i<4000;i++)h=sha256(h+salt+pw);return h}
const newSalt=()=>Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('');

async function saveUser(id){
  const D=FORM.D,err=m=>{$('#ferr').textContent=m};
  const name=(D.name||'').trim();let un=(D.username||'').trim().toLowerCase(),em='';
  if(!name)return err('Nama wajib diisi.');
  if(S.authMode){
    em=id?(S.users[id].email||''):(D.email||'').trim().toLowerCase();
    if(!id&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return err('Isi email yang valid.');
    if(!id&&Object.values(S.users).some(x=>(x.email||'').toLowerCase()===em))return err('Email sudah terdaftar.');
    if(!id&&(D.pw||'').length<6)return err('Password awal minimal 6 karakter.');
    un=em.split('@')[0];
  }else{
    if(!usernameOK(un))return err('Username 3-30 karakter: huruf kecil, angka, titik, strip, garis bawah.');
    if(Object.entries(S.users).some(([k,x])=>k!==id&&x.username===un))return err('Username sudah dipakai.');
    if(!id&&(D.pw||'').length<6)return err('Password minimal 6 karakter.');
    if(id&&D.pw&&D.pw.length<6)return err('Password minimal 6 karakter.');
  }
  const active=D.active!=='0';
  if(id&&(D.role!=='admin'||!active)){
    const others=Object.entries(S.users).filter(([k,x])=>k!==id&&x.role==='admin'&&x.active!==false);
    if(S.users[id].role==='admin'&&!others.length)return err('Harus ada minimal satu admin aktif.');
  }
  if(id===AUTH.id&&!active)return err('Anda tidak bisa menonaktifkan akun sendiri.');
  await safe(async()=>{
    const old=id?S.users[id]:{createdAt:Date.now()};let rec={...old,name,username:un,role:D.role,active};
    let nid=id;
    if(S.authMode){
      rec.email=em;delete rec.hash;delete rec.salt;
      if(!id){try{nid=await KN_AUTH.createUser(em,D.pw)}catch(e){return err(fbErr(e))}}
    }else{
      if(D.pw){rec.salt=newSalt();rec.hash=hashPw(rec.salt,D.pw)}
      nid=id||uid();
    }

/* ============ Firebase Authentication ============ */
let _subStarted=false;
async function onFbUser(u){
  if(!u){S.fbUser=null;S.authState='login';render(true);return}
  S.fbUser=u;
  try{
    const ps=await DBH.doc('users/'+u.uid).get();
    if(ps.exists){
      if(ps.data().active===false){S.authState='blocked';S.authMsg='Akun Anda dinonaktifkan. Hubungi admin.'}
      else{AUTH.id=u.uid;S.authState='ok';if(!_subStarted){_subStarted=true;subscribe()}}
    }else{
      const st=await DBH.doc('meta/setup').get();
      if(st.exists){S.authState='blocked';S.authMsg='Akun ini belum didaftarkan di aplikasi. Minta admin menambahkan email Anda di menu Pengguna.'}
      else S.authState='setup';
    }
  }catch(e){S.authState='blocked';S.authMsg='Tidak bisa membaca data ('+((e&&(e.code||e.message))||'?')+'). Periksa koneksi atau hubungi admin.'}
  render(true);
}
function vFbAuth(){
  const st=S.settings,mark=(st.logo?'<img class="loginlogo" src="'+esc(st.logo)+'" alt="'+esc(st.name)+'">':'<div class="mark" style="margin:0 auto 12px">'+esc((st.name||'T').charAt(0).toUpperCase())+'</div>');
  const f=(id,l,t,ac)=>'<label class="fld"><span>'+l+'</span><input id="'+id+'" type="'+(t||'text')+'" autocomplete="'+(ac||'off')+'"></label>';
  const A=S.authState;
  if(A==='blocked')return '<div class="loginwrap"><div class="logincard">'+mark+'<h1>Akses ditolak</h1><p class="hint">'+esc(S.authMsg||'')+'</p><button class="btn" style="width:100%;justify-content:center" data-act="fb-logout">Keluar</button></div></div>';
  if(A==='setup')return '<div class="loginwrap"><form class="logincard" id="loginForm" onsubmit="return false">'+mark+'<h1>Buat admin pertama</h1><p class="hint">Login sebagai '+esc(S.fbUser&&S.fbUser.email||'')+'. Belum ada pengguna terdaftar, jadi akun ini menjadi admin. Selesaikan sekarang agar tidak dipakai orang lain.</p>'+f('lname','Nama lengkap')+'<div class="err" id="lerr" style="min-height:18px"></div><button class="btn primary" style="width:100%;justify-content:center" data-act="fb-setup">Jadikan admin</button><button class="btn" style="width:100%;justify-content:center" type="button" data-act="fb-logout">Keluar</button></form></div>';
  return '<div class="loginwrap"><form class="logincard" id="loginForm" onsubmit="return false">'+mark+'<h1>Masuk</h1>'+f('lemail','Email','email','username')+f('lpw','Password','password','current-password')+'<div class="err" id="lerr" style="min-height:18px"></div><button class="btn primary" style="width:100%;justify-content:center" data-act="fb-login">Masuk</button><button class="btn sm" type="button" data-act="fb-forgot" style="justify-self:center">Lupa password?</button></form></div>';
}
const fbErr=e=>{const c=(e&&e.code)||'';return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'Email atau password salah.':/too-many/.test(c)?'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.':/invalid-email/.test(c)?'Format email tidak valid.':/email-already/.test(c)?'Email sudah terdaftar.':/weak-password/.test(c)?'Password terlalu lemah (min. 6 karakter).':/network/.test(c)?'Koneksi internet bermasalah.':/operation-not-allowed/.test(c)?'Login Email/Password belum diaktifkan di Firebase Console.':'Gagal: '+((e&&(e.message||e.code))||'kesalahan tidak diketahui')};

async function fbSetup(){
  const name=($('#lname').value||'').trim(),u=S.fbUser;if(!name)return lerr('Isi nama lengkap.');
  try{
    const bt=DBH.batch();
    bt.set(DBH.doc('users/'+u.uid),{name,email:u.email,username:(u.email||'').split('@')[0],role:'admin',active:true,createdAt:Date.now()});
    bt.set(DBH.doc('meta/setup'),{by:u.uid,at:Date.now()});

/* ============ Laporan ============ */
function repData(){
  const {repFrom:f,repTo:t}=ui,inR=d=>d&&d>=f&&d<=t;
  const rows=bookingsArr().filter(x=>inR(x.b.invoiceDate)),act=rows.filter(x=>x.b.status!=='cancelled');
  const cat={},sales={},cust={};
  act.forEach(x=>{
    (x.b.items||[]).forEach(i=>{const k=i.type||'Lainnya';cat[k]=cat[k]||{n:0,omzet:0,margin:0};cat[k].n+=num(i.qty);cat[k].omzet+=num(i.qty)*num(i.price);cat[k].margin+=num(i.qty)*(num(i.price)-num(i.cost))});
    const s=x.b.sales||'(tanpa sales)';sales[s]=sales[s]||{n:0,omzet:0,margin:0};sales[s].n++;sales[s].omzet+=x.c.total;sales[s].margin+=x.c.margin;
    const cn=custName(x.b.customerId);cust[cn]=cust[cn]||{n:0,omzet:0};cust[cn].n++;cust[cn].omzet+=x.c.total;
  });
  let recv=0;const pays=[];
  bookingsArr().forEach(x=>(x.b.payments||[]).forEach((p,i)=>{if(inR(p.date)){recv+=num(p.amount);pays.push({x,p,i})}}));
  const t0=todayISO(),aging={cur:{n:0,v:0},d30:{n:0,v:0},d60:{n:0,v:0},d90:{n:0,v:0},d90p:{n:0,v:0}};
  bookingsArr().filter(x=>x.b.status!=='cancelled'&&x.c.balance>0).forEach(x=>{
    const d=diffDays(t0,x.b.dueDate||x.b.invoiceDate),k=d<=0?'cur':d<=30?'d30':d<=60?'d60':d<=90?'d90':'d90p';aging[k].n++;aging[k].v+=x.c.balance;
  });
  return {rows,act,cat,sales,cust,recv,pays,aging,total:act.reduce((a,x)=>a+x.c.total,0),margin:act.reduce((a,x)=>a+x.c.margin,0),out:act.reduce((a,x)=>a+Math.max(0,x.c.balance),0)};
}

async function restoreFrom(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||typeof d!=='object')throw new Error('Format tidak dikenali');
    let n=0;
    await safe(async()=>{
      if(d.settings)await put('config','company',d.settings);
      for(const col of COLS)for(const [id,v] of Object.entries(d[col]||{})){await put(col,id,v);n++}
      toast(n+' dokumen dipulihkan');
    });
  }catch(e){toast('Berkas cadangan tidak valid')}
}

  Object.entries(S.departures).filter(([id])=>groupOf(id)===id).forEach(([id,d])=>{
    if(from&&(!d.departDate||d.departDate<from))return;
    if(to&&(!d.departDate||d.departDate>to))return;
    const ids=groupIds(id);
    if(act&&!ids.some(k=>rkMatch(S.departures[k],P)))return;
    const quota=num(d.quota);
    let conf=0,hold=0;
    ids.forEach(k=>{conf+=seatsIn(k);Object.values(S.bookings).forEach(b=>{if(b.departureId===k&&b.status==='draft')hold+=paxOf(b).length})});
    const done=(d.returnDate||d.departDate||'9999')<t;
    const st=done?'done':(quota>0&&conf>=quota)?'full':'open';
    if(ui.kStat&&ui.kStat!==st)return;
    out.push({id,d,ids,quota,conf,hold,pesan:conf+hold,left:quota-conf,st});
  });
  return out.sort((a,b)=>(a.d.departDate||'9').localeCompare(b.d.departDate||'9')||(a.d.name||'').localeCompare(b.d.name||''));
}
function tKuota(){
  const G=kGroups(),Q=G.filter(g=>g.quota>0);
  const sum=k=>Q.reduce((a,g)=>a+g[k],0),tq=sum('quota'),tp=sum('pesan'),tc=sum('conf'),th=sum('hold'),pc=v=>tq?Math.round(v/tq*100):0;
  const kp=(cls,l,v,sub)=>'<div class="card kpi kq '+cls+'"><small>'+l+'</small><b class="num">'+v+'</b><span>'+sub+'</span></div>';
  const cnt=k=>G.filter(g=>g.st===k).length;
  let h='<div class="kpis kq5">'+kp('','Total kuota',tq,'dari '+Q.length+' keberangkatan')+kp('warn','Total dipesan',tp,pc(tp)+'% dari total kuota')+kp('ok','Total dikonfirmasi',tc,pc(tc)+'% dari total kuota')+kp('yel','Ditahan belum bayar',th,pc(th)+'% dari total kuota (Draft)')+kp('blu','Sisa tersedia',tq-tc,'kursi masih bisa dikonfirmasi')+'</div>'
   +'<div class="card"><div class="cb row" style="gap:22px"><span><b style="color:var(--ok)">'+cnt('open')+'</b> Open</span><span><b style="color:var(--warn)">'+cnt('full')+'</b> Penuh</span><span><b class="mut">'+cnt('done')+'</b> Selesai (sudah berangkat)</span></div></div>';
  if(!G.length)return h+'<div class="card"><div class="empty"><h3>Tidak ada keberangkatan</h3><p>Tidak ada keberangkatan pada periode atau pencarian ini. Ubah rentang tanggal, atau tekan Range default.</p></div></div>';
  const bar=(v,q,c)=>'<div style="height:8px;border-radius:5px;background:var(--line);overflow:hidden"><div style="height:100%;width:'+Math.min(100,q?Math.round(v/q*100):0)+'%;background:'+c+'"></div></div>';
  return h+'<div class="stack" style="gap:12px">'+G.map(g=>{
    const d=g.d,pill_=g.st==='full'?pill('warn','FULL'):g.st==='done'?pill('cancel','SELESAI'):pill('paid','OPEN');
    const kids=g.ids.length>1?'<div class="kqparts">'+g.ids.map(k=>{const kd=S.departures[k],dc=durCode(kd.departDate,kd.returnDate),nm=String(kd.name||'-'),has=dc&&nm.toUpperCase().replace(/\s/g,'').includes(dc.toUpperCase());return '<div class="kqp click" data-act="goto-dep" data-id="'+k+'" title="Buka rekap program ini" style="cursor:pointer"><span>&bull; '+esc(nm)+(dc&&!has?' '+esc(dc):'')+'</span><b class="num">'+seatsIn(k)+' pax</b></div>'}).join('')+'</div>':'';
    const num_=(v,l,c)=>'<div class="kqn"><b class="num" style="color:'+c+'">'+v+'</b><small>'+l+'</small></div>';
    return '<div class="card"><div class="cb kqrow"><div style="min-width:0;flex:1 1 320px"><div class="row" style="gap:8px">'+pill_+'<span class="small mut">'+esc(durCode(d.departDate,d.returnDate))+(d.notes&&/high season/i.test(d.notes)?' &middot; <b style="color:var(--red)">High Season</b>':'')+'</span></div>'
     +'<div class="strong" style="font-size:16px;margin:4px 0">'+esc(d.name||'-')+'</div><div class="small mut">'+esc(rangeText(d.departDate,d.returnDate))+(d.tl&&d.tl.name?' &middot; TL: '+esc(d.tl.name):'')+'</div>'+kids+'</div>'
     +(g.quota>0?'<div class="row" style="gap:18px;flex:none">'+num_(g.quota,'TOTAL','var(--fg)')+num_(g.pesan,'DIPESAN','var(--warn)')+num_(g.conf,'CONFIRMED','var(--ok)')+num_(g.hold,'BELUM BAYAR','#b7791f')+num_(Math.max(0,g.left),'SISA',g.left<=0?'var(--red)':'var(--blue)')+'</div>'
     +'<div style="flex:0 0 230px;display:grid;gap:6px"><div class="small mut" style="display:flex;justify-content:space-between"><span>Dipesan</span><span>'+Math.round(g.pesan/g.quota*100)+'%</span></div>'+bar(g.pesan,g.quota,'var(--ok)')+'<div class="small mut" style="display:flex;justify-content:space-between"><span>Dikonfirmasi</span><span>'+Math.round(g.conf/g.quota*100)+'%</span></div>'+bar(g.conf,g.quota,'var(--ok)')+'<button class="btn sm" data-act="goto-dep" data-id="'+g.id+'">Detail booking</button></div>'
       :'<div class="small mut" style="flex:0 0 230px">Kuota belum diatur.<br><button class="btn sm" data-act="goto-dep" data-id="'+g.id+'" style="margin-top:6px">Buka &amp; atur kuota</button></div>')
     +'</div></div>'}).join('')+'</div>';
}
function vKuota(){
  const from=ui.kFrom===undefined?kDefFrom():ui.kFrom,to=ui.kTo===undefined?kDefTo():ui.kTo;
  return '<div class="pagehead"><div><h1>Summary Kuota</h1><p>Pantau kuota, pemesanan, dan sisa kursi setiap keberangkatan. Kuota bersama (3 Negara + 2 Negara) dihitung satu kali.</p></div></div>'
  +'<div class="card"><div class="filters" style="flex-wrap:wrap"><input type="search" id="q" placeholder="Cari nama tour, tanggal (23 des, des 2026), 7D6N, high season" value="'+esc(ui.q)+'" aria-label="Cari keberangkatan">'
  +'<select id="kStat" aria-label="Status"><option value="">Semua status</option><option value="open"'+(ui.kStat==='open'?' selected':'')+'>Open</option><option value="full"'+(ui.kStat==='full'?' selected':'')+'>Penuh</option><option value="done"'+(ui.kStat==='done'?' selected':'')+'>Selesai</option></select>'
  +'<label class="small mut" style="display:flex;gap:6px;align-items:center">Dari <input type="date" id="kFrom" value="'+esc(from)+'"></label><label class="small mut" style="display:flex;gap:6px;align-items:center">Sampai <input type="date" id="kTo" value="'+esc(to)+'"></label><button class="btn" data-act="kuota-reset">Range default</button></div></div>'
  +'<div id="listbody" class="stack" style="gap:14px">'+tKuota()+'</div>';
}

})();
