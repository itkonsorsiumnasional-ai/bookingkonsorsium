<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking & Invoice TravelKita</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sidebar navigasi + area kerja. Warna mengikuti logo TravelKita (biru dan merah). */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface2:#eceff8; --fg:#121a2e; --muted:#59627d; --line:#dce1ee;
  --blue:#1f4fd8; --on-blue:#ffffff; --blue-soft:#e3eaff; --red:#d62839; --red-soft:#fde6e9;
  --ok:#12805c; --ok-soft:#d9f3e8; --warn:#9a5a00; --warn-soft:#fdefd2; --shadow:0 1px 2px rgba(18,26,46,.06),0 4px 14px rgba(18,26,46,.05);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1323; --surface:#151c31; --surface2:#1e2741; --fg:#e8ecf8; --muted:#9aa5c3; --line:#2a3555;
    --blue:#7799ff; --on-blue:#0d1323; --blue-soft:#1b2a55; --red:#ff6d7c; --red-soft:#3b1b23;
    --ok:#52d3a3; --ok-soft:#12342b; --warn:#f2b24f; --warn-soft:#3a2c11; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1323; --surface:#151c31; --surface2:#1e2741; --fg:#e8ecf8; --muted:#9aa5c3; --line:#2a3555;
  --blue:#7799ff; --on-blue:#0d1323; --blue-soft:#1b2a55; --red:#ff6d7c; --red-soft:#3b1b23;
  --ok:#52d3a3; --ok-soft:#12342b; --warn:#f2b24f; --warn-soft:#3a2c11; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:18px;padding-top:4px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--blue);color:var(--on-blue);font:800 18px/36px var(--font-head);text-align:center;position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid var(--bg)}
.brand b{display:block;font:800 16px/1.1 var(--font-head)}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--red-soft);color:var(--red);border-radius:99px;padding:0 7px}
.sidenote{font-size:12px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:24px;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:transparent;background:none}
.btn.danger:hover{background:var(--red-soft)}
.btn.danger[data-armed="1"]{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>.ch h2{font-size:15px}
.card>.cb{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.02em}
.kpi b{display:block;font:800 22px/1.25 var(--font-head);margin-top:4px;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .bad{color:var(--red);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:620px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--surface2)}
.r{text-align:right}
.mut{color:var(--muted)}
.small{font-size:12.5px}
.strong{font-weight:600}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.paid,.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.partial,.pill.confirmed{background:var(--blue-soft);color:var(--blue)}
.pill.unpaid,.pill.draft,.pill.cancel,.pill.cancelled{background:var(--surface2);color:var(--muted)}
.pill.overdue{background:var(--red-soft);color:var(--red)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.filters input,.filters select{min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=search]{flex:1 1 220px;width:auto}
.filters select{width:auto;flex:0 1 170px}
textarea{resize:vertical}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--surface2)}
.li .r{text-align:right;flex:none}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sumbox{display:flex;flex-direction:column;gap:6px}
.sumbox div{display:flex;justify-content:space-between;gap:10px}
.sumbox .tot{font:800 18px var(--font-head);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.sumbox .due{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 10px;font-weight:700}
.sumbox .lunas{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.kv small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,15,30,.55)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.wide{width:min(900px,100%)}
.sheet.xl{width:min(900px,100%);background:var(--surface2)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh h2{font-size:17px}
.sb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sf{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sf .err{margin-right:auto;color:var(--red);font-weight:600;font-size:13px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:8px}
.x:hover{background:var(--surface2)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld.span2{grid-column:span 2}
.fld.full{grid-column:1/-1}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;background:var(--bg)}
.rowcard .wide2{grid-column:span 2}
.rows{display:flex;flex-direction:column;gap:8px}
.hint{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast[hidden]{display:none}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.paperwrap{overflow-x:auto}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;padding-bottom:4px}
  .nav button{padding:8px 11px;white-space:nowrap}
  .sidenote{display:none}
  .detail-grid{grid-template-columns:minmax(0,1fr)}
  .fld.span2{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
/* ============ Util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseD=iso=>new Date(iso+'T00:00:00');
const fmtDate=iso=>iso?parseD(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const compact=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M';if(a>=1e6)return (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';if(a>=1e3)return Math.round(n/1e3)+' rb';return String(Math.round(n))};
function terbilang(n){
  n=Math.floor(Math.abs(n));
  const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  const f=n=>{
    if(n<12)return s[n];
    if(n<20)return f(n-10)+' belas';
    if(n<100)return f(Math.floor(n/10))+' puluh'+(n%10?' '+f(n%10):'');
    if(n<200)return 'seratus'+(n%100?' '+f(n%100):'');
    if(n<1000)return f(Math.floor(n/100))+' ratus'+(n%100?' '+f(n%100):'');
    if(n<2000)return 'seribu'+(n%1000?' '+f(n%1000):'');
    if(n<1e6)return f(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+f(n%1e3):'');
    if(n<1e9)return f(Math.floor(n/1e6))+' juta'+(n%1e6?' '+f(n%1e6):'');
    if(n<1e12)return f(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+f(n%1e9):'');
    return f(Math.floor(n/1e12))+' triliun'+(n%1e12?' '+f(n%1e12):'');
  };
  const t=n===0?'nol':f(n);
  return t.charAt(0).toUpperCase()+t.slice(1)+' rupiah';
}
function setPath(o,path,val){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]];}c[k[k.length-1]]=val}

/* ============ Konstanta & data awal ============ */
const CATS=['Tiket Pesawat','Hotel','Paket Tour','Umroh & Haji','Visa & Dokumen','Transportasi','Asuransi Perjalanan','Lainnya'];
const TRIPS=['Domestik','Internasional','Umroh & Haji','Corporate / MICE'];
const METHODS=['Transfer Bank','Tunai','QRIS','Virtual Account','Kartu Kredit','Lainnya'];
const PAXT=['Dewasa','Anak','Bayi'];
const BSTAT={draft:'Draft',confirmed:'Dikonfirmasi',completed:'Selesai',cancelled:'Dibatalkan'};
const DEF_SET={name:'TravelKita',tagline:'Tours & Travel',address:'Ruko Kalimas Blok A 12, Jl. Chairil Anwar, Bekasi Timur',phone:'(021) 8834 1177',email:'',website:'www.travelkita-tours.com',npwp:'',banks:'',invPrefix:'INV',taxPct:0,dueDays:7,terms:'1. Pembayaran dianggap sah setelah dana diterima di rekening perusahaan.\n2. Pembatalan mengikuti kebijakan maskapai, hotel, dan penyedia layanan terkait.\n3. Harga dapat berubah sebelum pelunasan mengikuti kebijakan penyedia layanan.',signer:'',signerTitle:'Finance'};
const COLS=['customers','catalog','bookings'];
const S={customers:{},catalog:{},bookings:{},settings:clone(DEF_SET),loaded:false,mode:'local',got:{},slow:false};
const ui={route:'dashboard',q:'',fStatus:'',fPay:'',fCat:'',bookingId:null,repFrom:todayISO().slice(0,4)+'-01-01',repTo:todayISO(),dirty:false};
let DBH=null,DL=null,FORM=null;

const ICON={
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  booking:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/>',
  pelanggan:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14c2.2.7 3.5 2.6 3.5 6"/>',
  katalog:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  laporan:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  pengaturan:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const NAV=[['dashboard','Dashboard'],['booking','Booking & Invoice'],['pelanggan','Pelanggan'],['katalog','Katalog Layanan'],['laporan','Laporan'],['pengaturan','Pengaturan']];

/* ============ Perhitungan ============ */
function calc(b){
  const items=b.items||[];
  const subtotal=items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
  const cost=items.reduce((a,i)=>a+num(i.qty)*num(i.cost),0);
  const discount=num(b.discount);
  const base=Math.max(0,subtotal-discount);
  const tax=Math.round(base*num(b.taxPct)/100);
  const admin=num(b.adminFee);
  const total=base+tax+admin;
  const paid=(b.payments||[]).reduce((a,p)=>a+num(p.amount),0);
  return {subtotal,cost,discount,base,tax,admin,total,paid,balance:total-paid,margin:base-cost+admin};
}
function payState(b){
  const c=calc(b),t=todayISO();
  if(b.status==='cancelled')return {k:'cancel',l:'Dibatalkan'};
  const late=c.balance>0&&b.dueDate&&b.dueDate<t;
  if(c.total>0&&c.balance<=0)return {k:'paid',l:'Lunas'};
  if(late)return {k:'overdue',l:'Jatuh tempo '+diffDays(t,b.dueDate)+' hr'};
  if(c.paid>0)return {k:'partial',l:'Dibayar sebagian'};
  return {k:'unpaid',l:'Belum dibayar'};
}
const pill=(k,l)=>'<span class="pill '+k+'">'+esc(l)+'</span>';
function nextSeq(stemFn,field){
  let max=0;const stem=stemFn;
  for(const b of Object.values(S.bookings)){const v=b[field];if(v&&v.startsWith(stem)){max=Math.max(max,parseInt(v.slice(stem.length))||0)}}
  return stem+String(max+1).padStart(4,'0');
}
function nextInvoiceNo(dateISO){return nextSeq((S.settings.invPrefix||'INV')+'/'+dateISO.slice(0,4)+dateISO.slice(5,7)+'/','invoiceNo')}
function nextCode(dateISO){return nextSeq('BK-'+dateISO.slice(2,4)+dateISO.slice(5,7)+'-','code')}
const custName=id=>(S.customers[id]&&S.customers[id].name)||'(pelanggan dihapus)';
const bookingsArr=()=>Object.entries(S.bookings).map(([id,b])=>({id,b,c:calc(b)})).sort((x,y)=>(y.b.invoiceDate||'').localeCompare(x.b.invoiceDate||'')||(y.b.createdAt||0)-(x.b.createdAt||0));

/* ============ Penyimpanan ============ */
const LS='tk-booking-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({customers:S.customers,catalog:S.catalog,bookings:S.bookings,settings:S.settings}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.customers=d.customers||{};S.catalog=d.catalog||{};S.bookings=d.bookings||{};S.settings={...DEF_SET,...(d.settings||{})}}}catch(e){}}
async function put(col,id,data){
  data=clone(data);
  if(col==='config')S.settings={...DEF_SET,...data};else S[col][id]=data;
  if(S.mode==='db')await DBH.doc(col+'/'+id).set(data);else saveLocal();
  sched();
}
async function del(col,id){
  delete S[col][id];
  if(S.mode==='db')await DBH.doc(col+'/'+id).delete();else saveLocal();
  sched();
}
function subscribe(){
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  const check=()=>{if(COLS.every(c=>S.got[c])&&S.got.config&&!S.loaded){S.loaded=true;clearTimeout(timer)}};
  COLS.forEach(col=>{
    DBH.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S[col]=m;S.got[col]=true;check();sched()},e=>{S.err=e&&e.code;S.loaded=true;sched()});
  });

async function saveFile(filename,data){
  if(!DL){
    try{
      const blob=new Blob([data],{type:/\.json$/.test(filename)?'application/json':/\.csv$/.test(filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('File diunduh: '+filename);
    }catch(e){toast('Gagal mengunduh file')}
    return;
  }
  try{await DL.save({filename,data});toast('File siap disimpan')}catch(e){if(e&&e.code==='declined')return;toast('Gagal mengunduh: '+((e&&(e.message||e.code))||''))}

  B.forEach(x=>(x.b.payments||[]).forEach(p=>{const m=months.find(m=>m.k===(p.date||'').slice(0,7));if(m)m.recv+=num(p.amount)}));

  +'<div class="cols">'

  +(tobill.length?'<div class="list">'+tobill.map(x=>'<div class="li" data-act="open" data-id="'+x.id+'"><div class="stack"><span class="strong">'+esc(custName(x.b.customerId))+'</span><span class="small mut">'+esc(x.b.invoiceNo)+' &middot; jatuh tempo '+fmtDate(x.b.dueDate)+'</span></div><div class="r stack"><span class="strong num">'+rp(x.c.balance)+'</span>'+(()=>{const p=payState(x.b);return pill(p.k,p.l)})()+'</div></div>').join('')+'</div>':'<div class="empty">Semua invoice sudah lunas.</div>')

function chart(ms){
  const max=Math.max(1,...ms.map(m=>Math.max(m.bill,m.recv)));
  const pw=Math.pow(10,Math.floor(Math.log10(max)));let nice=Math.ceil(max/pw)*pw;if(nice/pw>5&&nice/pw<=7)nice=7*pw;
  const W=640,H=230,L=52,R=8,T=12,Bm=28,iw=W-L-R,ih=H-T-Bm,gw=iw/ms.length,bw=Math.min(26,gw/3);
  let g='';
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+compact(nice*i/4)+'</text>'}
  ms.forEach((m,i)=>{
    const cx=L+gw*i+gw/2,h1=ih*m.bill/nice,h2=ih*Math.max(0,m.recv)/nice;
    g+='<rect x="'+(cx-bw-2)+'" y="'+(T+ih-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="var(--blue)"><title>'+esc(m.l+' tagihan '+rp(m.bill))+'</title></rect>';
    g+='<rect x="'+(cx+2)+'" y="'+(T+ih-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="var(--ok)"><title>'+esc(m.l+' diterima '+rp(m.recv))+'</title></rect>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(m.l)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik tagihan dan penerimaan 6 bulan terakhir">'+g+'</svg>';
}

async function saveBooking(){
  const D=FORM.D,err=m=>{const e=$('#ferr');if(e)e.textContent=m};
  if(!D.customerId)return err('Pilih pelanggan terlebih dahulu.');
  if(D.customerId==='__new'&&!D.newCust.name.trim())return err('Isi nama pelanggan baru.');
  const items=D.items.filter(i=>(i.desc||'').trim());
  if(!items.length)return err('Isi minimal satu layanan dengan deskripsi.');
  if(items.some(i=>num(i.qty)<=0))return err('Jumlah (qty) layanan harus lebih dari 0.');
  if(D.departDate&&D.returnDate&&D.returnDate<D.departDate)return err('Tanggal pulang tidak boleh sebelum tanggal berangkat.');
  if(!D.invoiceDate)return err('Tanggal invoice wajib diisi.');
  await safe(async()=>{
    let cid=D.customerId;
    if(cid==='__new'){cid=uid();await put('customers',cid,{name:D.newCust.name.trim(),type:'Perorangan',phone:D.newCust.phone,email:D.newCust.email,address:'',idNo:'',notes:'',createdAt:Date.now()})}
    const rec={...D,customerId:cid,items:items.map(i=>({desc:i.desc.trim(),type:i.type,qty:num(i.qty),price:num(i.price),cost:num(i.cost),catId:i.catId||''})),passengers:D.passengers.filter(p=>(p.name||'').trim())};
    const id=D.id||uid();
    delete rec.newCust;delete rec.dp;delete rec.id;
    if(!D.id){
      rec.code=nextCode(rec.invoiceDate);rec.invoiceNo=nextInvoiceNo(rec.invoiceDate);rec.createdAt=Date.now();rec.payments=[];
      if(D.dp&&num(D.dp.amount)>0)rec.payments.push({id:uid(),date:D.dp.date||rec.invoiceDate,method:D.dp.method,amount:num(D.dp.amount),ref:D.dp.ref||'',note:'Pembayaran awal / DP'});
    }
    await put('bookings',id,rec);
    closeModal();ui.route='booking';ui.bookingId=id;try{history.replaceState(null,'','#booking')}catch(e){}render(true);window.scrollTo(0,0);
    toast(D.id?'Booking diperbarui':'Booking dan invoice dibuat: '+rec.invoiceNo);
  });
}

async function savePay(id){
  const D=FORM.D,amt=num(D.amount);
  if(amt<=0){$('#ferr').textContent='Isi jumlah lebih dari 0.';return}
  if(!D.date){$('#ferr').textContent='Tanggal wajib diisi.';return}
  await safe(async()=>{
    const b=clone(S.bookings[id]);b.payments=b.payments||[];
    b.payments.push({id:uid(),date:D.date,method:D.method,amount:D.kind==='refund'?-amt:amt,ref:D.ref,note:D.note});
    await put('bookings',id,b);closeModal();toast('Pembayaran dicatat');
    const c=calc(b);if(c.balance<=0)toast('Invoice '+b.invoiceNo+' lunas');
  });
}

    'Kepada: '+custName(b.customerId),'Tujuan: '+(b.destination||'-')];
  if(b.departDate)L.push('Berangkat: '+fmtDate(b.departDate)+(b.returnDate?' - '+fmtDate(b.returnDate):''));

function repData(){
  const {repFrom:f,repTo:t}=ui,inR=d=>d&&d>=f&&d<=t;
  const rows=bookingsArr().filter(x=>inR(x.b.invoiceDate)),act=rows.filter(x=>x.b.status!=='cancelled');
  const cat={},sales={},cust={};
  act.forEach(x=>{
    (x.b.items||[]).forEach(i=>{const k=i.type||'Lainnya';cat[k]=cat[k]||{n:0,omzet:0,margin:0};cat[k].n+=num(i.qty);cat[k].omzet+=num(i.qty)*num(i.price);cat[k].margin+=num(i.qty)*(num(i.price)-num(i.cost))});
    const s=x.b.sales||'(tanpa sales)';sales[s]=sales[s]||{n:0,omzet:0,margin:0};sales[s].n++;sales[s].omzet+=x.c.total;sales[s].margin+=x.c.margin;
    const cn=custName(x.b.customerId);cust[cn]=cust[cn]||{n:0,omzet:0};cust[cn].n++;cust[cn].omzet+=x.c.total;
  });
  let recv=0;const pays=[];
  bookingsArr().forEach(x=>(x.b.payments||[]).forEach((p,i)=>{if(inR(p.date)){recv+=num(p.amount);pays.push({x,p,i})}}));
  const t0=todayISO(),aging={cur:{n:0,v:0},d30:{n:0,v:0},d60:{n:0,v:0},d90:{n:0,v:0},d90p:{n:0,v:0}};
  bookingsArr().filter(x=>x.b.status!=='cancelled'&&x.c.balance>0).forEach(x=>{
    const d=diffDays(t0,x.b.dueDate||x.b.invoiceDate),k=d<=0?'cur':d<=30?'d30':d<=60?'d60':d<=90?'d90':'d90p';aging[k].n++;aging[k].v+=x.c.balance;
  });
  return {rows,act,cat,sales,cust,recv,pays,aging,total:act.reduce((a,x)=>a+x.c.total,0),margin:act.reduce((a,x)=>a+x.c.margin,0),out:act.reduce((a,x)=>a+Math.max(0,x.c.balance),0)};
}

      ['smpb2',mk('',{customerId:'smpc1',destination:'Umroh 9 hari',tripType:'Umroh & Haji',invoiceDate:addDays(t,-1),dueDate:addDays(t,30),departDate:addDays(t,60),returnDate:addDays(t,69),passengers:[{name:'Budi Santoso',type:'Dewasa',idNo:'',note:''},{name:'Ani Santoso',type:'Dewasa',idNo:'',note:''}],items:[{desc:'Paket Umroh 9 hari',type:'Umroh & Haji',qty:2,price:31500000,cost:28800000}],payments:[{id:'p1',date:addDays(t,-1),method:'Transfer Bank',amount:10000000,ref:'TRF-2301',note:'DP'}]})]
    ];
    for(const [id,b] of defs){b.code=nextCode(b.invoiceDate);b.invoiceNo=nextInvoiceNo(b.invoiceDate);await put('bookings',id,b)}
    toast('Data contoh ditambahkan');
  });
}
async function unseed(){
  await safe(async()=>{
    let n=0;
    for(const col of COLS)for(const [id,d] of Object.entries(S[col])){if(d.sample){await del(col,id);n++}}
    toast(n?n+' data contoh dihapus':'Tidak ada data contoh');
  });
}
function backup(){
  saveFile('cadangan-booking-'+todayISO()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),settings:S.settings,customers:S.customers,catalog:S.catalog,bookings:S.bookings},null,2));
}
async function restoreFrom(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||typeof d!=='object')throw new Error('Format tidak dikenali');
    let n=0;
    await safe(async()=>{
      if(d.settings)await put('config','company',d.settings);
      for(const col of COLS)for(const [id,v] of Object.entries(d[col]||{})){await put(col,id,v);n++}
      toast(n+' dokumen dipulihkan');
    });
  }catch(e){toast('Berkas cadangan tidak valid')}
}

/* ============ Event ============ */
function armed(el){
  if(el.dataset.armed==='1')return true;
  el.dataset.armed='1';el.dataset.label=el.textContent;el.textContent='Klik lagi untuk menghapus';
  setTimeout(()=>{if(el.isConnected){el.dataset.armed='0';el.textContent=el.dataset.label}},4000);
  return false;
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,id=el.dataset.id,i=parseInt(el.dataset.i);
  switch(a){
    case 'nav':go(el.dataset.r);break;
    case 'close':closeModal();break;
    case 'open':closeModal();ui.route='booking';ui.bookingId=id;try{history.replaceState(null,'','#booking')}catch(x){}render(true);window.scrollTo(0,0);break;
    case 'back':ui.bookingId=null;render(true);break;
    case 'new-booking':if(ui.route!=='booking'&&ui.route!=='dashboard'){}openBookingForm();break;
    case 'edit-booking':openBookingForm(id);break;
    case 'save-booking':saveBooking();break;
    case 'add-pass':FORM.D.passengers.push({name:'',type:'Dewasa',idNo:'',note:''});FORM.rerender();break;
    case 'rm-pass':FORM.D.passengers.splice(i,1);FORM.rerender();break;
    case 'add-item':FORM.D.items.push({catId:'',desc:'',type:'Tiket Pesawat',qty:1,price:0,cost:0});FORM.rerender();break;
    case 'rm-item':if(FORM.D.items.length>1){FORM.D.items.splice(i,1);FORM.rerender()}break;
    case 'del-booking':if(armed(el)){await safe(async()=>{await del('bookings',id);ui.bookingId=null;toast('Booking dihapus');render(true)})}break;
    case 'add-pay':openPayForm(id);break;
    case 'save-pay':savePay(id);break;
    case 'del-pay':if(armed(el)){await safe(async()=>{const b=clone(S.bookings[id]);b.payments.splice(i,1);await put('bookings',id,b);toast('Pembayaran dihapus')})}break;
    case 'invoice':showPaper('inv',id);break;
    case 'receipt':showPaper('rc',id,i);break;
    case 'copy-wa':copyText(invoiceText(id));break;
    case 'dl-invoice':{const b=S.bookings[id];saveFile('Invoice-'+safeName(b.invoiceNo)+'.html',docHTML('Invoice '+b.invoiceNo,invoiceHTML(id)));break}
    case 'dl-receipt':{const b=S.bookings[id];saveFile('Kwitansi-'+safeName(receiptNo(b,i))+'.html',docHTML('Kwitansi '+receiptNo(b,i),receiptHTML(id,i)));break}
    case 'new-cust':openCustForm();break;
    case 'edit-cust':openCustForm(id);break;
    case 'save-cust':saveCust(id);break;
    case 'del-cust':if(armed(el)){if(Object.values(S.bookings).some(b=>b.customerId===id)){toast('Pelanggan ini masih punya booking, hapus bookingnya dulu');break}await safe(async()=>{await del('customers',id);closeModal();toast('Pelanggan dihapus')})}break;
    case 'new-cat':openCatForm();break;
    case 'edit-cat':openCatForm(id);break;
    case 'save-cat':saveCat(id);break;
    case 'del-cat':if(armed(el)){await safe(async()=>{await del('catalog',id);closeModal();toast('Layanan dihapus')})}break;
    case 'save-settings':await safe(async()=>{await put('config','company',FORM.D);ui.dirty=false;render(true);toast('Pengaturan disimpan')});break;
    case 'seed':seed();break;
    case 'unseed':unseed();break;
    case 'backup':backup();break;
    case 'restore':$('#restoreFile').click();break;
    case 'csv-inv':saveFile('invoice-'+ui.repFrom+'-sd-'+ui.repTo+'.csv',csvInvoices());break;
    case 'csv-pay':saveFile('pembayaran-'+ui.repFrom+'-sd-'+ui.repTo+'.csv',csvPays());break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='restoreFile'){if(t.files[0])await restoreFrom(t.files[0]);t.value='';return}
  if(t.id==='fStatus'){ui.fStatus=t.value;updateList()}
  else if(t.id==='fPay'){ui.fPay=t.value;updateList()}
  else if(t.id==='fCat'){ui.fCat=t.value;updateList()}
  else if(t.id==='repFrom'||t.id==='repTo'){ui[t.id]=t.value||ui[t.id];render(true)}
  else if(t.id==='stSel'&&ui.bookingId){await safe(async()=>{const b=clone(S.bookings[ui.bookingId]);b.status=t.value;await put('bookings',ui.bookingId,b);toast('Status diubah ke '+BSTAT[t.value])})}
  else if(t.dataset&&t.dataset.pick!==undefined&&FORM){
    const idx=parseInt(t.dataset.pick),c=S.catalog[t.value],it=FORM.D.items[idx];
    it.catId=t.value;
    if(c){it.desc=c.name;it.type=c.category;it.price=num(c.price);it.cost=num(c.cost)}
    FORM.rerender();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;updateList()}
});

/* ============ Mulai ============ */
(async function boot(){
  const r=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===r))ui.route=r;
  render();
  try{const c=window.claude;if(c&&c.use){DBH=await c.use('db');DL=await c.use('downloads')}}catch(e){}
  if(DBH){S.mode='db';subscribe()}else{S.mode='local';loadLocal();S.loaded=true;render()}
})();
</script>
